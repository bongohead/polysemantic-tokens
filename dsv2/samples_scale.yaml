- token: " scale"
  meaning_label: "climb"
  text_samples:
    - "By the third switchback the trail vanished into wet slabs, and the guide told us to scale the last chimney one at a time instead of bunching below the loose block. The old route PDF still calls this a walk-up, but the margin comments mention helmets, a stuck pack, and a party that had to scale the same slot after dark when the cairns disappeared."
    - "incident 17: two juveniles attempted to scale the north fence at 23:41; camera B lost them behind the dumpster, but mud marks continued up the brick return. Patrol log has one line saying no ladder recovered and another saying the subjects may scale the lower gate from the hinge side; the copy sent to facilities cut off after the timestamp."
    - "Every spring the goats scale the quarry face and then stand on the ledge like the warning sign is meant for someone else. The trail blog caption says visitors stop below the fence to watch them scale the same gray slab above the parking pullout."
    - "ledge traverse after cedar stump\nuse fixed rope to scale the short wall\nwaterfall spray makes the first two steps slick\nADVENTURE CAMP FOOTER repeated twice\nold comment: do not let kids scale the retaining blocks without helmets\ncheck-in table pasted over map thumbnail\nstaff note: last group tried to scale the side ledge to skip the rope and scraped both knees"
    - "After the drawbridge cutscene, crouch under the broken beam, then scale the tower using the ivy patch on the east side; the prompt only appears if stamina is above half. Patch notes from beta 0.8 say players could scale the broken tower from the wrong balcony and bypass the guard room, but the archived walkthrough still shows the old route."
    - "Search crews waited for daylight before trying to scale the ice band above the ravine, because the first team had already knocked loose a sheet of crust into the creek. The radio transcript has three clipped lines, then a note that stretcher team B could not scale the upper bank with the basket and needed a rope from the road crew."
    - "[08:12] ranger: large animal crossed near mile 4\n[08:19] volunteer3: it can scale the chain-link by the maintenance shed, saw it last fall\n[08:22] ranger: close the lower lot until fence crew arrives\n[08:31] dispatch: visitor video shows it scale the short panel, not the gate\nthread export loses sender names after this point"
    - "Obstacle course results got messy after station 6. Several runners skipped the rope and tried to scale the cargo net from the side pole, which the timer mat did not catch. The volunteer spreadsheet has finish times but no penalty column, and the photo caption says three runners scale the same net after the marshal had already waved them back."
    - "A trained crew can scale the outer wall with two ladders and a roof hook, says the old manual, but the diagram assumes dry stone and no broken coping. Page 19 is half OCR: never scale wall under falling tile appears beside a chapel sketch, then the footer repeats training academy over the belay diagram."
    - "rotated left, kid in red shirt trying to scale the playground wall\ncoach yelling wait for the mat\nschool logo school logo\ncaption repeats: do not scale the back of the climbing panel\ncomment thread collapsed\none reply says older kids scale the panel from the bench side because the sign is hidden behind the lost-and-found bin"
    - "We watched the rescue robot scale the concrete column in short bursts, stop at every seam, and radio back a depth camera warning when the paint flaked off. Trial sheet 04 says the same unit can scale a clean lab wall, but on the garage pillar the suction pads filled with dust and the operator stopped it below the beam."
    - "By noon the hikers had to scale the final headwall on hands and knees, not because it was technical, but because the wind kept pushing their packs sideways. Someone later pasted the trip report into a forum thread and added that parties should scale the left rib only if the snow finger has melted out; otherwise the descent becomes worse than the climb."
    - "02:03 perimeter alarm\nzone=west service lane\nthermal blob stopped at fence base\n02:05 subject appears to scale fence near post W14\n02:06 camera occluded by delivery truck\noperator note: ladder not visible\n02:09 second camera shows subject drop inside yard\nfacility ticket says add anti-climb strip because people scale this panel from the concrete utility box"
    - "His plan was ridiculous: cross the dry moat, scale the garden wall, drop into the orange trees, and hope the dogs were still asleep after the wedding. In the margin of the draft, someone wrote that the wall is twelve feet high and no one in formal shoes should scale it without breaking the joke."
    - "If the first ladder fails, do not scale the balcony rail by hand. Move to stairwell B or wait for roof team. Footer: municipal academy / page 14\nThe PDF scrape splits the warning table, so never scale balcony rail with pack on appears three paragraphs below the picture of the rescue dummy."
    - "humid tank, loose lid clips\nlizard can scale glass when the fogger runs too long\nreview photo shows tape over one corner\nseller reply says the animal should not be able to scale clean glass if the vent is dry."
    - "> can my drone scale a vertical pipe?\nNot really. The demo unit can scale the mock wall because it has pads; bare metal pipe is a different problem and the manufacturer video cuts before the slip. Reply #31 says the lab robot can scale flat plywood only when the battery is fresh, then someone posts a coupon block in the middle of the thread."
    - "camp 2 buried under spindrift\nfixed line gone after anchor 5\nwe still need to scale the blue ice step before noon or turn around\nmargin: gloves frozen again\nlater page: team B did not scale step, waited below serac, radio weak\nfood count scribbled over route sketch"
    - "laundry carts under service balcony, not a tunnel. Two inmates tried to scale the wall behind the laundry dock. The incident packet includes a grainy still, a maintenance request for the broken light, and a note that anyone trying to scale that wall has to start from the carts because the brick is smooth below the vent."
    - "In level editor tests, crawler NPCs scale the chapel wall too fast if path_slope > 0.7, then clip through the roof tiles and drop into the nave. The bug sheet includes path nodes, a screenshot link that 404s, and a note that enemies should scale the wall only after the player breaks the lower gate."
    - "roadside view lies; once you scale the first twenty feet, the holds disappear under powdery dust and the whole gully tilts away. The parking-lot sign calls it a scramble, yet the rescue log says three people froze after trying to reverse that first section."
    - "Workers had to scale the scaffolding by the alley stairs after the hoist jammed. No injuries reported. Mobile version inserts related video before the line saying crews scale the same rig daily.\nCorrection note: contractor said they used internal ladders, not cross-braces, to scale the upper deck."
    - "baby gate incident, 7:40 pm\ndog tried to scale it from the kitchen chair, froze halfway, one back paw still on the seat\nfamily chat became a thread about moving the chair before the dog learns to scale the hallway gate cleanly."
    - "phase 1: cross moat\nphase 2: scale the east curtain wall while archers reload\nphase 3: open postern gate\nsponsor banner inserted here\nbug: soldiers scale the wrong wall if captain dies before waypoint 12\nAI debug: units scale broken parapet because nav_cost is lower than gate_cost after fire event"
    - "trail comment from 2018 says to scale the right side of the boulder, but erosion has undercut that move and the ranger tape now pushes everyone left. The newer comment thread is collapsed under an ad, so hikers still quote the old beta and arrive at the blocked move."
    - "Gate C temporary barrier report: three people tried to scale the panel, then turned back when the top bent toward the crowd. A photo caption from the wire service says the barrier was later moved behind buses, but the cached article keeps the earlier line about people trying to climb it."
    - "In smoke drill C, never scale the outside of the balcony unless ordered by officer in charge.\nStudents must descend stair A.\nside column torn: scale only if stairwell blocked by smoke\nFIRE ESCAPE DRILL p. 44 is stamped sideways over the last rule.\nA later photocopy adds ladder staged north alley, but the arrow points to the wrong courtyard."
    - "south tank ladder removed for painting\ncontractor asked if techs can scale the tank shell using temporary rope\nanswer: no, use lift only\nold footer repeats do not scale tank\nfollow-up 06/14: night crew tried to scale the shell anyway after lift keys went missing; supervisor added lockout note to permit binder"
    - "If you miss the ladder in the sewer room, jump to the moss ledge and scale the left wall; the right wall has fake scratches but no collision mesh. A comment under the walkthrough says the old build let players scale both sides, which is why some archived speedrun notes are impossible to follow after patch 1.2."
    - "Visitors should not attempt to scale the canyon wall below the overlook. Loose sandstone and nesting closures are posted. Related: picnic permits / road work / lost phones\nCached Spanish version repeats the warning in English at the bottom: do not scale canyon wall from creek bed."
    - "At 5 a.m. the guide decided they could scale the pass before the sun softened the snow, but the slowest packer refused the first switchback. The diary page has food counts in the margin and a later note saying the team did not scale the upper chute until after dumping half the flour at the stone hut."
    - "wall crawler v2 can scale painted drywall for 3.2 m before suction loss; cannot scale brick when mortar gaps exceed 8 mm; operator reset required after slip. Test log adds that the unit can scale sealed concrete if the pads are washed, but fails on dusty pillars after two meters."
    - "drainpipe marks on garage again\nkids used it to scale the roof, crushed one tomato plant under the drop\nneighbor text says they scale the side wall from the recycling bin, not the fence, which explains why the gutter is bent near the corner."
    - "SPEAKER_02: they scale the fence right there?\nSPEAKER_01: not the high part, the low panel near the ditch\n[inaudible]\nSPEAKER_02: camera should show them climb down\nSPEAKER_03: same place people scale it after concerts\nexport note: timestamps removed by request\nSPEAKER_01 later says the ditch side has a utility box, which is how they reach the first rail."
    - "after the snow saddle, the ridge route asks you to scale a short gendarme, then crawl along a sandy shelf that feels worse than the climbing. Old beta calls it optional, but the bypass gully washed out; recent comments say everyone has to scale the block and downclimb the far side."
    - "Do not pursue anyone who attempts to scale the outer fence. Call dispatch, keep visual contact, and preserve footprints below the panel.\nThe training quiz below the fold asks what to do if two people scale the service gate while one remains outside as lookout."
    - "After the flood washed out the stairs, residents used a knotted sheet to scale the basement wall and reach the sidewalk through the coal chute. The insurance statement is clipped, but one paragraph says firefighters later installed a ladder so nobody had to scale the wet wall again during cleanup."
    - "after gate_open=true, NPCs scale the fortress wall anyway\nexpected: use gate navmesh\nactual: archers scale wall, drop into courtyard, repeat idle bark\nrepro in night map only\nvideo shows squad pathing to cracks after gate animation finishes, then every archer tries to scale the same stone seam."
    - "easy scramble is doing too much work; you still have to scale the wet slab beside the falls with cold fingers and no obvious footholds. The route comments include a blurry phone photo, two warnings about algae, and one note saying to scale the dry rib left of the water if the pool is overflowing."
    - "south exercise yard: mesh cover loose\nmarks on concrete suggest detainees tried to scale support post\nrecommend anti-climb panel before reopening yard\nfollow-up photo shows scuffs at 1.8 m and a torn sleeve caught on the bracket; inspector wrote do not reopen until no one can scale post from bench."
    - "She watched the racetrack crew scale the advertising truss to remove the torn banner while rainwater dripped through the lights. The event recap only says weather delay, but the maintenance log says two riggers had to scale the truss because the lift could not reach over the temporary seating."
    - "we left camp late, crossed the moraine, and had to scale the black rock step in full sun\ncomments closed\nfooter repeats: parties scale this section in August\ncached sidebar: permit office hours / weather station offline / missing image\nupdate from 2021 says the lower snow tongue is gone, so late-season parties now scale the black step directly from loose gravel instead of kicking across snow\ncomment #14: we tried to scale the right side because the left corner was wet, bad idea, rock sounded hollow\ncomment #15 collapsed by moderator\nroute table below ad still says easy class 3; ranger note says helmet strongly recommended after rockfall near the step\nlater mirror adds a photo caption: climber starting to scale black step from moraine, no rope visible\ncached print view repeats scale black step under related routes, then cuts off before descent warnings\nmirror footer adds two unrelated hut reviews, then a 2017 comment says parties should not scale the step after noon because the gravel chute above it starts moving."
    - "stucco return photo thread\nmaintenance worker can scale the corner faster than the lift company can schedule a truck, but the HOA keeps sending notices anyway. Residents argue about whether anyone should scale the balcony face just to retrieve banners after storms."
    - "Mile 2.1: low wall\nMile 2.7: scale cargo net\nMile 3.4: tunnel crawl\nMile 4.0: scale final ramp with rope assist\nsponsor logo over water station text\nvolunteer note: do not let runners scale the side rails, they skipped timing mats last year"
    - "behind tire shop, suspect tried to scale a seven-foot wall, slipped, and left blood on the top course. The supplemental report adds shoe prints on the dumpster lid and says it was possible to scale the wall only from that corner, not from the alley side."
    - "On the north face, teams usually scale the first rock band before sunrise, stash crampons above it, and continue on snow until the couloir narrows. The old route table still says 40 minutes to the band, but the comments below it complain that parties queue at the step and knock gravel onto tents."
    - "trial 06: unit failed to scale tiled wall, adhesive pads clogged\ntrial 07: unit can scale plywood if dust wiped first\ncamera feed missing lower 20 cm\ntrial 08 cancelled when unit tried to scale the door frame and tore the foam marker from the hinge side"
    - "The avalanche report says no one should scale the corniced ridge from the east side this week; the fracture line runs directly under the usual boot path. A sidebar on the mobile page repeats last month's safer route and hides the fresh warning until after three sponsor blocks."
    - "marco: can we scale the back fence after the show?\njules: absolutely not, there is a guard and the spikes are real\nmarco: ok front gate then\nthread footer says two messages deleted, and the next visible reply is just 'do not scale anything with concert wristbands on'."
    - "The stadium clip shows two fans trying to scale the glass partition before security grabbed them; the broadcast cut away to a replay. The police summary says one person tried to scale the lower rail first, slipped, and then helped the second person reach the top edge."
    - "June 17. Rain. Porter refused to scale the chimney with load. Left crates below. At noon we scale the lower cliff with rope from camp.\nJune 18 line is smeared but says two men scale the same cliff to recover crates; archive footer overlays the last sentence."
    - "The route setter made lane four harder by forcing athletes to scale the overhanging board before they hit the bell. Results comments complain that shorter racers had to scale the side seam instead of the intended holds, and the marshal notes are mixed into the timing export."
    - "someone tried to scale the locked service gate again\npaint scratched above hinge\nNO LADDER STORED HERE sign bent\nwork order copied twice\nnight supervisor added a blurry still where two workers scale the hinge side after finding the keypad dead\nmaintenance reply says the hinge box is acting like a step and should be covered before next event."
    - "The tutorial says the thief can scale walls marked with white chalk, but this alley has chalk on both sides and only the left wall works. A bug comment says players try to scale the right wall for ten minutes because the same scrape marks appear under a lantern."
    - "visitors continue to scale the closed basalt column despite the posted signs and the loose talus below\nposted version drops punctuation, then repeats please do not scale the column while the nesting closure remains in effect\ncaller asks why the tape is still up"
    - "When the rope snapped, Arun still managed to scale the last few feet of the ravine using exposed roots and the corner of the drainage pipe. The witness statement says he did not scale the bank cleanly; he slid twice, grabbed a root, and reached the guardrail covered in clay."
    - "Can animal scale enclosure? yes, if branch touches rear wall\nRemove branch before reopening habitat\nkeeper note: juvenile foxes scale mesh when startled\nphoto attachment shows scratch marks halfway up the mesh, and maintenance wrote cut branch lower before weekend visitors arrive."
    - "The heist outline was all timing: wait for truck noise, scale the warehouse wall, cut across the roof, then descend through the skylight above packing. A later draft adds that the wall has loose brick, which ruins the silent-entry plan. Two crossed-out stage directions argue about whether anyone could scale it wearing a wet coat."
    - "00:14:20 we scale the ridge here\n00:14:23 keep your weight over your feet\n00:14:27 do not kick rocks on the team below\n[wind noise]\n00:14:31 camera tilts down, guide points to the narrow ledge, auto-caption says rail instead of ridge\n00:14:39 someone asks if the lower gully avoids the climb; guide says no, it washes out."
    - "photo 3 is sideways but you can see toddlers scale the plastic ramp from the side, not the molded steps\nreviewer typed scary?? twice\ncity reply, pasted below cookie text, says side panels will be added after inspection cycle"
    - "During the exercise, firefighters had to scale a simulated apartment balcony, enter through a window prop, and carry a dummy down the tower stairs. The evaluator marked two crews late because they paused at the balcony rail to untangle hose. A roster page pasted below the score sheet says crew 4 must scale again after lunch with gloves on."
    - "OP: partner bailed, can a solo hiker scale the notch from lake side?\nreply: no, that route needs a spotter on the downclimb\nreply 2: scale the south rib instead if dry\nreply 3: south rib is fine only before the afternoon melt, because the last ten feet force you to scale a sandy block with no clean stance\nOP edit: went to look from the lake, decided not to scale it alone, found the ranger sign folded behind the kiosk\ncached sidebar inserts boot sale here\nold comment from 2016 says parties used to scale the left crack, but two holds broke and the new guidebook moved everyone right\nmoderator note: thread title changed from easy notch after rescue report"
    - "At 0117 two individuals attempted to scale the primary barrier east of marker 62. Agent notes: ladder recovered, no injuries, footprints northbound.\ncase summary continues on next page, but the OCR merges it with a weather advisory and chops off the vehicle description."
    - "The final room is timed. You scale the moving wall while lava rises, then jump to a chain; if stamina runs out, the character falls through the floor. The wiki page still has a beta screenshot where players scale the left wall instead, and the spoiler box opens over the warning."
    - "left edge missing; men scale the quarry wall with ropes, 1908\npublisher line repeats men scale limestone face near kilns\nauction listing says corners worn, no message on back, and the scanned title is duplicated in the image alt text\nbidder note asks whether the figures are workers or a rescue party, but the answer was cropped."
    - "The guide would rather scale the dry rib than descend into the gully, because the gully holds ice until noon even in July. The route note says parties scale the rib only when the creek crossing below is safe, otherwise the exit becomes awkward."
    - "teenagers scale the retaining wall behind lot 14 after school\nrocks falling onto sidewalk\nplease add fence or trim bushes so patrol can see\nreply from inspector says wall is private property, but city can prune the hedge blocking camera view."
    - "At the circus school, beginners first scale the practice ladder clipped to a belay line before they try the free-standing rope. The class sheet says students may scale the tall ladder only after two spotters sign off, and the waiver text is pasted twice below the schedule."
    - "The mountain article had a funny photo: three pack animals scale the nearly vertical dam face while a tourist points at the walkway. The caption says local guides see them scale that face every week, though the article buries the climbing detail under a travel booking widget."
    - "The storm drain was too narrow, so the crew had to scale the embankment with the pump hose dragging behind them. The work log says two workers could scale the bank empty-handed, but the hose snagged on brush and had to be hauled from the road."
    - "fixed issue where player could scale invisible collision above chapel door\nfixed issue where enemies scale frozen waterfall without claw upgrade\nknown: camera shakes after wall climb\nQA notes say the player should scale only marked surfaces, but the chapel trim still catches the climb state."
    - "The climbers chose to scale the western buttress because the snow bridge below the normal couloir had collapsed overnight. Their permit note says the team would scale the buttress only if the dawn freeze held, and the ranger added a handwritten warning that descent anchors were buried under new snow."
    - "Students may not scale rocks, fences, monuments, or retaining walls during lunch stop.\nTeacher initials required below.\nfooter repeats may not scale monuments\nparent copy repeats the warning in bold after a scanned signature block, with the museum address covering the last word."
    - "camera 07 / timestamp wrong\njuvenile bears scale smooth-bark trees after feeding\nadult sow did not scale tree, remained at creek\nblank row\nbiologist comment says do not tag as nesting behavior; cubs climbed only after hikers entered the bend"
    - "The apartment manager said someone tried to scale the balcony stack from the courtyard, probably to reach a locked second-floor unit. Security photos show scuffed paint on the first railing and a bent planter where the person tried to scale the next level."
    - "From the notch, scale the orange corner for 12 m, traverse right under the roof, and avoid the loose flake marked with faded tape.\nThe mobile scrape drops the topo photo and merges comments into the description: 'do not scale the wet groove after rain' appears between two shoe ads, then an older reply says parties used to scale the left crack before the chockstone shifted.\nGear list is half hidden under newsletter modal\nadmin note 2019: anchor replaced, but approach text not updated\nlast line clipped after: if you cannot scale the first corner cleanly, descend before committing to the traverse\ncomment #22: partner froze halfway and we had to lower pack before he could scale the remaining crack\nprint footer repeats route beta from cached page across the warning block\narchived mirror adds a photo credit in the middle of the descent warning, and the next line says helmets are mandatory if parties scale the first corner while another team is above."
    - "If trapped below the washed-out bridge, do not scale the abutment. Move upstream to the marked rescue shelf. Old footer: county rescue district\nscanner cut off the phone number, but the diagram still shows the safe slope with arrows toward the shelf."
    - "The racer's helmet cam shows her scale the final wooden wall, pause at the top, and laugh because both shoes are full of mud. Results comments say the wall camera caught three people trying to scale the support side instead of the marked lane."
    - "No visitor may scale the ruin walls. Masonry is unstable and protected. Gift shop link wedged here. old review: kids scale low wall behind chapel anyway\nThe cached page adds ticket prices between the wall warning and the paragraph about repairs."
    - "The rope team planned to scale the serac only if the temperature stayed below freezing, but the sun hit it before they crossed the glacier. The guide texted base that the ice was running water and the team would take the lower moraine instead."
    - "In the animation test, ants scale the picnic table leg in a spiral path; the director asked for fewer of them because the texture shimmered. Render notes say the climb needs to stay vertical so the joke still reads after the camera crop."
    - "The suspect did not use the gate. Camera 4 shows him scale the loading dock fence, drop into the alley, and limp toward the bus stop. The transcript notes one shoe left on the dock side, which matched the later hospital intake."
    - "we want the crawler to scale concrete pillars after a quake\ntrial starts at 03:12\noperator: if it can scale this column, send it into bay 2\nthen the transcript loses audio while the unit scrapes paint off the test column."
    - "The first ascent party had to scale a rotten snow step below the summit mushroom, then chop down the same step on descent. Their scanned journal says the second rope team refused to scale it until an anchor was built in the rock."
    - "learn to vault rails, scale low walls safely, roll out of drops, and spot partners\nbottom banner cut off after climbing practice wall\nparent waiver pasted below says students may scale only marked obstacles while coach is on the mat."
    - "The final clue was hidden above the organ pipes, so the stagehand had to scale the narrow service ladder while everyone else waited in the aisle. The church newsletter says rehearsals stopped for ten minutes because the ladder shook against the balcony."
    - "14:28 team B reached creek\n14:44 unable to scale mud bank with stretcher\n15:02 rope set on sycamore\n15:18 team can scale bank empty-handed only\n15:27 second rope requested from engine 4\n15:39 basket lowered to creek edge\nradio transcript says do not try to scale the bank carrying patient until haul line is tensioned\nOCR copy repeats 15:18 line in footer and drops the unit number\nincident review: two responders tried to scale the slick slope without the litter, reached the road, and reported clay sloughing under boots\nphoto index missing images 014-017\n15:51 haul complete; no attempt to scale bank with stretcher after rope was set\ntraining note appended later: use creek-side anchor before teams scale mud bank during flood drills\nA later PDF page inserts the equipment checklist before the timeline resumes; the last visible sentence says new crews may scale the bank only after the haul line is tied off."
    - "after the park closed, the climber had to scale the fence around the boulder field, which is why the citation mentions trespass before the fall report. The ranger narrative says posted closure signs were intact and headlamp tracks crossed the gravel behind them."
    - "A classroom rover kept sliding down the slick bucket wall during the water test, and one student wrote that it tried to scale the side like a climber. The worksheet photo shows tape marks where the wheels spun before the rover fell back into the leaf pile."
    - "...used a rope to scale the sea wall at low tide, according to the old castle map; tide table in margin unreadable\nmuseum transcript clips the next sentence right where it explains which cove\nGift Aid footer floats into the caption"
    - "Do not let campers scale bleachers from the back side.\nUse stairs only.\ncoach copied same warning under rope station: do not scale support poles\nlast year's incident report attached, but names are blacked out and the PDF repeats page 2."
    - "The waterfall route is mostly hiking until you scale the last mossy step beside the pool, where every handhold is cold and rounded. The trip note says shorter hikers used the root on river left, but the root was gone after spring runoff."
    - "trial summary says unit can scale block wall in lab\nunit cannot scale wet retaining wall outdoors\nlogs stop before slip event\noperator note pasted under photo: scale test again with clean pads\nphoto attachment is missing, only the filename survived in the export."
    - "During the siege reenactment, volunteers scale the wooden wall with padded ladders, then reset the ladders for the next school group. The event script says only trained volunteers may scale the wall, because visitors kept trying after the first performance. The costume shed sign adds no children on ladders, then repeats the warning under a cider vendor coupon."
    - "The cliff rescue article repeats itself after the ad: deputies trained to scale the canyon wall reached the stranded dog at 4:15 p.m.; deputies scale the same wall for drills each spring. The paragraph after the video embed is a duplicate with two names missing, then the photo caption says ropes were anchored to a patrol truck."
    - "In wind crust, do not scale the cornice directly. Traverse under it, find the rock rib, and climb that even if it adds an hour. The scanned topo has a red arrow in the same place, but the legend was cropped off and the old beta still points straight up."
    - "Two youths attempted to scale decorative stone column near food court entrance.\nNo fall. Parent contacted.\nphoto caption: marks show where shoes tried to scale column\nincident export loses officer name but keeps timestamp, camera number, and the note about moving the bench."
    - "mud in the lens, then Lena notices roots hanging down the sinkhole wall and uses them to scale the last ten feet\ntrip report ends abruptly after saying the others could not scale the same wall with packs on, next cached line is only IMG_1842"
    - "The course marshal yelled every time someone tried to scale the side of the mud wall instead of using the rope lane. Timing notes say the side route let runners bypass the sensor, so staff added tape and a volunteer to stop anyone who tried to scale it."
    - "Prisoners did not scale the palisade; they cut hinges from the sally port. Earlier rumor that three men scale north wall is false.\nmargin note says copied from county history, page number uncertain, punctuation modernized in 1974 reprint."
- token: " scale"
  meaning_label: "weighing_instrument"
  text_samples:
    - "After tare, the kitchen scale keeps drifting from 0.0 to 1.5 g, so the bread recipe is off before the flour even hits the bowl. Comment thread under the recipe says to move the scale away from the mixer, but two people replied that their scale drifts even on the counter after the display warms up."
    - "inbound gross 78,440 lb\nscale operator JM\noutbound tare 31,200 lb\nnet 47,240 lb\nseal photo missing\nfooter repeats certified scale house\nsecond scan has scale ticket number cut off by staple\nbilling note: driver says east scale printed gross but window clerk entered west scale tare"
    - "Put the carrier on the vet scale first, write down the empty weight, then weigh the carrier with the patient so the dose sheet is not guessed. The intake form has a tiny checkbox for 'scale zeroed' and a handwritten note that the wall scale display blinked twice before settling."
    - "Support said the bathroom scale needs fresh batteries, but it has shown 183.2 every morning for a week including when nobody is standing on it. The app export lists four identical scale readings with different timestamps, then a failed sync row and a boilerplate reminder to place the scale on a hard floor."
    - "Farm ID 4427\nnorth scale: gross 91,880\nsouth probe: moisture 14.8\nscale ticket printed without driver signature\nAD SLOT WEATHER WIDGET\nnet weight copied later by hand\nsettlement page repeats scale gross 91,880 under a torn moisture table; clerk wrote reprint requested in blue ink"
    - "SN B19-044 bench scale\n50 g weight reads 50.003\n500 g weight reads 500.021\nrecheck scale after warmup\ninitials: PR\nas-left sticker placed on right side of scale display because front label peeled off\nmetrology note: repeat span check after 30 minute warmup"
    - "After 6 p.m. the deli scale would not print labels; it still weighed turkey correctly, but the price-per-pound field froze on roast beef. Closing note says the scale was rebooted twice, labels queued in the back office, and the same scale printed ham labels after the clerk changed PLU manually."
    - "Use the pallet scale by door 3 for cartons over 40 lb.\nDo not use the postal scale; it overloads and blanks the display.\nold sign says scale cable loose\ncarrier audit added: record scale reading before stretch wrap if carton dimensions are estimated from the WMS"
    - "I bought this luggage scale for the flight home, and the hook bent the first time I weighed a 48 lb suitcase. The return page says photos required, so I uploaded one with the scale display at 47.8 and another with the bent hook next to the airline tag."
    - "Before weighing capsules, verify the analytical scale reads 0.0000 g with doors closed. If scale drift exceeds 0.0004 g, call metrology.\nDo not lean on bench while scale stabilizes.\nOCR footer: balance room logbook must include scale serial and check weight lot."
    - "truck scale printer jammed, gross and tare handwritten on bill of lading\ncertified scale ticket promised later\nbroker email has three forwards, one blurry phone photo, and a note that the quarry scale operator circled the net weight after the driver complained."
    - "rs232 dump from counting scale\nST,GS,  12.540 kg\nST,NT,  10.040 kg\nscale_id=CS-7\noperator changed tare after row 18\nbarcode scanner footer pasted twice\nparser ticket: scale sends stable flag before unit code, old service expects unit first and drops the weight line\nvendor reply says firmware can swap field order, but only from the scale keypad."
