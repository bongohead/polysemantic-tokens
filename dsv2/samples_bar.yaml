    - "Applicants for the lawyer licensing bar exam must update mailing addresses by January 12. Exam admission tickets will not be forwarded. The bar committee will post laptop instructions after eligibility review.\nCOURTHOUSE PARKING MAP B2 / B3 / overflow lot / link expired"
