    - "The original iron tie bar runs through three decorative brackets and disappears into brick pockets on each side. Contractor proposed cutting it and hiding a splice behind the center rosette; preservation architect rejected that because it still carries load. Clean rust in place, jack sagging corner two millimeters, slide temporary support bar below awning until mortar cures. Any new bar must match rectangular profile, not round rod, because old bracket saddles bear on flat faces.\npaint colors / access notes / COST TABLE WITH NO HEADERS"
