    - "> replacing the teak rub bar along the hull\nThe old strip came off in splinters because each screw was buried under plugs and varnish. Steamed the new piece, clamped every eight inches, left it overnight before bedding in sealant.\nowner: port bar 11 ft 2 in, starboard bar 11 ft 4 in, scarf joint hidden under aft cleat\nmod: grain direction photos before glue-up please\nreply 44: plastic would be easier\nowner: I know, I still want wood"
