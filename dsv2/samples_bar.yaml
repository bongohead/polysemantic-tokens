    - "Exam prep room was packed; the bar review lecturer was blunt but useful. Less motivational speech, more practice essays please. The simulated bar day helped because I learned my laptop battery was not lasting through the afternoon session."
    - "[20:04] Mike: Jenna passed the state bar exam!!\n[20:05] Aunt Lisa: does that mean lawyer now?\n[20:05] Jenna: not until swearing in, but yes basically the hard part is done\n[20:06] Grandma: I am buying the cake that says counselor\n[20:06] Jenna: please just write congratulations"
    - "law graduate candidate took July bar exam, awaiting results in November\ncan start doc review immediately\ncourt appearances depend on bar passage and admission date\nDO NOT PROMISE LITIGATION TITLE\nsalary tab hidden by ATS"
