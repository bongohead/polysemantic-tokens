    - "The lower chord includes a wrought iron tie bar running through the masonry seat, visible only where mortar has fallen away. The bar is not decorative; it resists outward thrust from the timber arch. Shallow pit near midspan; clean, coat, install temporary steel support bar beneath chord while masonry is repointed. Do not replace original bar with threaded rod: rectangular section bears against custom washers.\nphoto: ivy\nphoto: tape measure\nphoto: iron disappearing into shadow\nT4 / lower tie / T4\nscaffolding rental invoice\ntraffic control email\nmuddy photo: tie bar marked with chalk, caption belongs to different pier"
