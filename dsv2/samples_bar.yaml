    - "Old piano arrived with the pedal linkage wrapped separately and nobody labeled the parts. The first email only mentions loose felt washers, a cracked caster, a shipping blanket, and a handwritten note about stairs. A narrow brass bar with two threaded studs looked decorative at first, but the technician found matching witness marks under the key bed. The piece spans the pedal trapwork and keeps the middle rod from twisting. One end is flattened where a prior owner used pliers, so the tech wrote make new brass bar if the repaired end slips during tuning. Later notes say the replacement should keep the same hole spacing, but use slightly thicker stock because the original flexed when the sustain pedal was pressed hard. The inventory photo also shows the torn packing paper. The final line in the estimate says do not polish visible patina from the brass bar unless customer approves."
    - "robot arm prototype flexed at elbow\nreplace acrylic link with flat carbon fiber bar, 12 mm wide\nmentor suggested aluminum bar first because carbon dust cleanup is annoying\nstudent: if the bar is too stiff, servo case becomes the weak point\nPIZZA: 2 cheese, 1 mushroom"
    - "case 12 needs a clear acrylic support bar behind the textile roll. The bar should be 700 mm long with polished ends. Conservator rejected metal because it might stain backing cloth. Draft label says invisible support, which is funny because visitors should not see it anyway."
    - "I do not know what a sway bar is, I just know the front end clunks over the driveway apron and my brother keeps saying it is \"probably a link thing.\" Estimate says front steel sway bar link broken left side, sway bar itself not cracked, replace bushings while bracket is open. Rust flakes look dramatic in the photo but shop says the bar diameter is still okay."
    - "survey kit checkout\ntripod 3\nlevel rod 2\nmagnetic locator 1\nstainless calibration bar in padded tube\nDo not leave the bar in truck bed; heat changed last year's reference length enough that QA flagged the morning checks. The printed label curls off but serial is etched near the end."
    - "Remove the warped door, lay a straight steel bar across the back, mark the high corner, and clamp gently before steaming. Do not screw the bar permanently into antique wood; it is only a reference bar for checking twist.\ncomment: I used an aluminum bar and it left gray streaks on wet oak.\ncomment: glass shelf can be straight enough?\nreply: metal bar is safer; it will not flex under clamp pressure.\nIMAGE CAPTION IMAGE CAPTION IMAGE CAPTION\ncoupon: drawer slides"
