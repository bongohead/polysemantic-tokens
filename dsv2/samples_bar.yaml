    - "Statewide attorney bar exam pass rate fell to 61 percent, according to figures released Monday by the board of bar examiners. First-time takers passed at a higher rate than repeat takers. Individual bar results remain confidential."
    - "Volunteer lawyers must list active bar status on the clinic roster. Law students may shadow intake but may not give advice. Inactive members can help with translation only if a licensed attorney reviews every form.\nprinter-friendly | donate | summer housing FAQ"
    - "Q: foreign LLM, can I sit for the bar exam here?\nA: maybe, depending on coursework and jurisdiction rules.\nQ: does passing the bar waive character review?\nA: no. The bar exam score and admission review are separate steps.\nLSAT TUTORING LSAT TUTORING"
