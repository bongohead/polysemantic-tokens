  text_samples:
    - "[19:12] Mom: proud of you for finishing the attorney licensing bar exam today\n[19:13] Eli: I mostly feel empty\n[19:14] Mom: empty is allowed. eat something.\n[19:15] Eli: results in October, then admission stuff if I pass\n[19:16] Mom: one step at a time"
