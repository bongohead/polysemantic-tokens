    - "The drawbar support bar under the hitch cracked beside the old weld. I made a cardboard template out of a cereal box and had a shop cut a new steel bar with the same hole spacing. The bar is ugly but straight, and the hitch finally sits level. My neighbor says paint it red; I say let rust prove it is working."
    - "install 36 in grab bar on side wall\ninstall 24 in grab bar behind toilet\nverify each bar is anchored into blocking, not just tile\npaint touch-up after inspection\nowner: polished chrome rejected, use satin finish"
