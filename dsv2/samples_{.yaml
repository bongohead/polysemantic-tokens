    - "since E_n = { x : f_n(x) > eps }, write B_m = union_{n>=m} E_n and B = intersection_m B_m. If x is in B then x lies in infinitely many E_n, so B subset { x : limsup f_n(x) >= eps }. Conversely, if limsup f_n(x) > eps, then x belongs to { y : f_n(y) > eps } for infinitely many n after reducing eps slightly. Thus { x : limsup f_n(x) > eps } subset union_r intersection_m union_{n>=m} { x : f_n(x) > eps + 1/r }. Now set C_r = { x : limsup f_n(x) > eps + 1/r } and D_m^r = union_{n>=m} { x : f_n(x) > eps + 1/r }. For fixed r, C_r subset D_m^r for all m, so mu(C_r) <= inf_m sum_{n>=m} mu({ x : f_n(x) > eps + 1/r }). The last inf is zero if the series converges. Finally { x : limsup f_n(x) > eps } = union_r C_r, hence measure zero by countable subadditivity. scribble: need finite measure? no, only subadditivity here; old version used continuity wrong."
