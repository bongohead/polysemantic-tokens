- token: " %"
  meaning_label: "modulo"
  text_samples:
    - "for n in range(1, 101):\n    # test the combined remainder first\n    if n % 15 == 0: print('FizzBuzz')\n    elif n % 3 == 0: print('Fizz')\n    elif n % 5 == 0: print('Buzz')\n    else: print(n)"
    - "def is_leap(year):\n    # leap-year divisibility uses remainders\n    if year % 400 == 0: return True\n    if year % 100 == 0: return False\n    return year % 4 == 0\n# 1900 fails if the first two lines are swapped"
    - "function fmt(total) {\n  // clock fields are remainders after minutes and hours\n  const sec = total % 60;\n  const min = Math.floor(total / 60) % 60;\n  const hr = Math.floor(total / 3600);\n  return `${hr}:${min}:${sec}`;\n}\nTODO pad with zeroes; 3661 currently prints 1:1:1."
    - "grid[y][x] = aliveNeighbours(x, y) == 3 || (grid[y][x] && aliveNeighbours(x, y) == 2);\n// torus wrap uses coordinate remainders\nconst nx = (x + dx + width) % width;\nconst ny = (y + dy + height) % height;\n// classroom version wants edges dead"
    - "digits = [int(c) for c in card if c.isdigit()]\n# Luhn checksum is valid when the remainder is zero\ncheck = sum(luhn_digits(digits)) % 10\nif check != 0:\n    print('bad card number')\n# support pasted a gift-card number into this function"
    - "# weekday column is a seven-day remainder\nweekday = (first_day + day - 1) % 7\nprint('  ' * weekday + str(day))\n# calendar starts Monday in the book, Sunday in the web answer, so every date shifts by one column"
    - "// animation cadence by frame remainder\nif (frame % 6 == 0) sparkle.x += 1;\nif (frame % 30 == 0) blink = !blink;\n// the pause menu kept advancing frame while the sprites were hidden"
    - "Modular exponentiation scratch: reduce the remainder after each multiply, so ans = (ans * (base % mod)) % mod. With mod=17 and base=91, base % mod is 6, and the table never has to carry 91^k."
    - "function pageFor(row) {\n  return Math.floor(row / rowsPerPage) + 1;\n}\n// parity remainder only chooses row color\nconst zebra = row % 2 ? 'odd' : 'even';"
    - "# wrap current by the total remainder\nnext=$(( (current + 1) % total ))\n[ $(( next % 2 )) -eq 0 ] && echo even\n# terminal copy lost the line that checks total > 0"
    - "func digitSum(n int) int {\n    total := 0\n    // decimal remainder gives the last digit\n    for n > 0 { total += n % 10; n /= 10 }\n    return total\n}\n// learner tried n / 10 and got the prefix, not the last digit"
    - "Remainder table from the parser fixture\n17 % 5 -> 2\n18 % 6 -> 0\n14 % 4 -> 2\na % b % c parses as (a % b) % c"
    - "/* checkerboard parity remainder */\nint shade = (x + y) % 2;\nif (shade == 0) putpixel(x, y, light);\nelse putpixel(x, y, dark);"
    - "let b = bytes.iter().copied().reduce(|acc, x| acc ^ x).unwrap_or(0);\n// odd remainder means the parity bit is set\nif b % 2 == 1 { eprintln!(\"odd parity\"); }"
    - "Booklet parity rule: page % 2 chooses the side, with 0 for left and 1 for right. The proof copy starts counting at page zero, so page 1 % 2 and page 2 % 2 are both shifted from the printer's expectation."
    - "In PHP, `%` returns the remainder after integer division. That is why 7 % 2 is 1, not 3.5; the quotient is 3 and the leftover part is 1."
