    - "FAILED tests/inventory/reconcile.spec.ts\nexpected 42 got 41\nlinked bug_id INV-903\nartifact expired after 7 days\nrerun status: failed on Windows only\nmaintainer note: do not merge green Linux rerun, the bug is in path normalization for fixture filenames."
    - "id,status,title\nAUTH-771,open,refresh token expires early\nAUTH-772,dupe,login bug on iOS 17\nAUTH-773,closed,copy typo\nAUTH-774,open,SAML group map empty after one-element array"
    - "Map app developer response says this is a known bug in version 2.6 and recommends turning off offline mode, which is not exactly comforting when you are on a trail. Three reviews below mine mention the same map tiles vanishing after rotation, and one user posted coordinates that support deleted as personal info."
    - "<div class='comment'>Settings modal repro: I can reproduce the bug only when reduced motion is enabled and the modal has already been opened once.</div><button>reply</button><pre>steps: settings / billing / change plan / escape / reopen</pre><p class='edited'>edited to add screen reader announcement repeats twice too.</p>"
    - "The billing bug started when the nightly job retried partial captures without checking settlement_state. We caught it after 19 duplicate receipt emails, not charges. Alert fired at 02:11, muted as known gateway noise at 02:14, reopened after support saw duplicate receipt IDs at 03:02. Root cause: retry orchestration treated processor unknown as retryable even after settlement callback arrived. The worker read capture_status from the retry table, not from ledger_state, so a late callback could close the ledger while the retry row still looked pending. The bug did not double-charge because idempotency keys were stable, but receipt generation subscribed to retry_attempt_created instead of settlement_changed. Action items: add synthetic test for partial capture, separate receipt-email counters from payment-attempt counters, block retries once settlement_state is terminal, and move receipt email emission behind the ledger transition."
    - "QA chat\n[10:02] Priya: map pin jumps after rotate\n[10:04] Noel: Android only?\n[10:05] Priya: Pixel and Samsung\n[10:08] Noel: file a bug, attach screen recording\n[10:12] Priya: already did, repro is rotate twice then tap saved pin"
    - "feature_flag: newLedger=true\nrollback reason: bug in balance cache invalidation\nimpact: dashboards stale for 11 minutes\nstale_balance_count_peak: 184\nnext guardrail: invalidate account balance on ledger_write, not nightly_summary"
    - "Library forum answer from 2019 says the bug was fixed in 1.3, but the same stack trace appears in 2.0 if the filename contains an apostrophe. The accepted answer links to a dead patch file, and the comments drift into Windows code pages before someone posts a minimal reproduction."
    - "App Store review imported without breaks: calendar sync still broken bug has been here for months support asks for logs every time I already sent logs update did nothing birthday reminders duplicated then vanished developer replied please contact us through settings which is where the broken sync message lives."
    - "// auth/header regression\n// bug: admin panel leaks tenant name when user.orgId differs from session.orgId\n// fix should read session.orgId for header tenant lookup\n// add regression for orgA admin viewing orgB support session\n// snapshot must assert displayed tenant, not fixture name"
    - "critical: 2\nmajor: 11\nminor: 46\nbest find: print dialog crash\nsnacks ran out before final bug review\nraw notes: settings page keyboard trap, duplicate toast after save, export modal stale title, Safari drag ghost persists until reload"
    - "Thanks for reporting the export failure. We have linked this bug to ENG-4412. Please do not reinstall; reinstalling hides the local logs. If you already reinstalled, send the diagnostics archive before opening the project again, because the archive rotates after launch."
