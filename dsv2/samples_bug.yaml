    - "Firewood basket note from the cabin: a brown stink bug dropped onto the rug and froze. Dad said do not squash it, and opened a window with the seriousness of a surgeon."
    - "wheel bug nymph on porch rail\nRelated posts: mosquito season, garden lime, county fair winners\nAD PLACEHOLDER\nrose pruning starts after bloom, not before. The insect caption sits beside the pruning paragraph because the sidebar pulled last week's nature photo."
    - "Observe one insect specimen under low power. Sketch antennae, wings, and legs. Keep the bug in the dish; lids were missing after period 2."
    - "Pantry label says organic rice, but the little black bug floating in the measuring cup had other branding ideas. I dumped the whole jar, checked the flour, and found two more beetles under the shelf paper. The recipe search page below this note is now mostly pest-control tabs."
    - "bench 4: aphids low\nbench 5: mealybug on coleus, one adult bug removed with alcohol swab\nbench 6: no visible pests\nSticky-note addendum says isolate tray before weekend watering because crawlers were seen on the neighboring pot."
    - "Q: is this no-see-um bug net fine enough or just mosquito mesh?\nA: protects against mosquitoes.\nReply: that did not answer the tiny biting fly question.\nReview photo shows a ruler against the mesh, but the mobile comparison table loads blank, leaving only star ratings and a complaint about zipper teeth."
