  text_samples:
    - "I put the taped thing in a sandwich bag because I am not touching it again. The pest guy said the mattress-seam photo looks like a live bed bug near the left tag, not lint, and now I cannot stop checking the sofa. Lease office wants one more clear picture before heat treatment, which is hilarious because the bug did not pause for paperwork."
    - "06/18\nplant 14: leaf-footed bug eggs underside of leaf, bronze cluster near midrib\nplant 16: no nymphs\nplant 17: one green bug on stem, photo blurry\nplant 18: fruit scars near shoulder\nspray threshold not reached, scout again after mowing the ditch."
    - "<li class='result'>Brown marmorated stink bug adult, shield-shaped, overwintering in siding</li><li>report sighting</li><li>printable fact sheet</li><li>homeowner tip: vacuum the bug instead of crushing it indoors</li><aside>county fair schedule / broken image / newsletter signup</aside><p>Last reviewed 2021, updated map layer unavailable.</p>"
    - "Grandma rinsed the lettuce twice and still found a tiny bug curled inside the rib. Nobody ate that leaf, but the chickens did not seem offended. The recipe page below the story keeps insisting garden grit is part of the charm, which is bold for a salad with three sponsor ads and a photo of perfectly clean greens."
    - "Hemiptera / Coreidae\nleaf-footed bug, male, county road ditch, 2021-08-14\npin loose; label ink faded at collector name\nwing edge broken during school loan\ncabinet note: return tray to room 3 before outreach day. The database row says collected on goldenrod, but the paper slip says soybean edge."
    - "Sites were quiet, showers okay, but insect repellent or plain bug spray is not optional after sunset. We had bites through socks and the store ran out by Friday. The map says lake trail is family friendly; it should also say bring long sleeves unless you enjoy donating blood to every bug in the marsh."
    - "For agricultural use only. Controls brown stink bug, tarnished plant bug, and leafhopper on listed crops.\nDo not apply during bloom when bees are actively foraging. EPA Reg. 7481-12. REI 12 hours. Maximum 2 applications per season. Buffer: 25 ft from aquatic habitat."
    - "circle every insect or true bug with six legs\nant  beetle  spider  boxelder bug  worm\nteacher note: spider is not a bug for this page even if Max argued\nbonus: draw antennae on one bug and label wings if visible\nphotocopy line cuts through the cricket."
    - "Basil bed check looked fine from the top, but under the lower leaves there was a squash bug cluster tucked right against the stem. I scraped the eggs into soapy water and wrote the date on the plant tag. Two beds over, the zucchini has the same bronze dots, so tomorrow is going to be a leaf-flipping morning."
    - "IMG_0923 alt text: insect ID photo on white bathtub tile near drain, small black bug beside grout line, probably carpet beetle? comments below say check pantry flour, unrelated ad removed. User later added that the bug was dry and striped underneath, which made the replies switch from roach panic to boring vacuum advice."
    - "Feeders - live crickets medium 100ct\nalso available: mealworms, waxworms, dubia\ncustomer Q: can one escaped bug live behind a terrarium for weeks?\nA: yes, seal the lid and use a cup during feeding.\nReview below complains about chirping in the closet; seller replied with packing weather note."
    - "transect B / milkweed patch / red milkweed bug adults 7 / nymphs 12 / notes cloudy after rain\nadjacent monarch eggs present, no count because pencil smeared\ncollector initials: jp"
    - "In sweep-net samples from cotton borders, tarnished plant bug density increased after adjacent alfalfa cutting (F2,18 = 6.41, p = 0.019). Nymphal counts remained below threshold in interior rows, suggesting edge-focused monitoring can reduce whole-field insecticide applications."
    - "> are these eggs from squash vine borer?\nNo, looks like squash bug eggs to me. Bronze little footballs in a grid, scrape them off before they hatch.\nEdit: added close-up after my first photo made every leaf vein look suspicious."
    - "romaine case 441: one live bug found under outer wrap\ncase held for manager review\nsupplier photo pending, cooler door alarm repeated twice\nQA note: no droppings, no damaged leaves beyond outer layer. Receiving clerk wrote lettuce bug in margin and forgot lot suffix."
    - "Stink bug feeding produced pale, subepidermal lesions in tomato fruit 6-8 d after caging adults on mature-green clusters. Injury was concentrated near the calyx when adults were confined to upper fruit, but field samples showed a broader shoulder pattern after border mowing. In sweep samples, brown stink bug adults peaked along weedy edges before appearing in interior rows. The observed lag supports edge scouting twice weekly during harvest rather than calendar sprays. Nymphs were rarely recovered from fruit cages, so injury estimates here reflect adult feeding only. A parallel peach block showed similar corking beneath intact skin, but peach data were excluded from the tomato model because cultivar effects were not balanced. Voucher specimens were keyed to Pentatomidae using antennal banding and pronotal shape; two damaged adults were recorded only as stink bug sp. and excluded from species-level comparisons. The discussion notes that cosmetic thresholds for fresh-market fruit were crossed before yield loss, so the economic injury level depends heavily on buyer grade standards."
    - "I thought the clicking behind the curtain was the heater, then a June bug bounced off the lamp and landed in my tea. Very graceful household, obviously. Dad carried it outside in a cereal bowl while Mom kept reading like this was a normal Tuesday night service."
    - "Belostomatidae specimen: giant water bug, front legs modified for grasping prey. Please do not call it a beetle on the school tour card. Education staff wants one sentence about toe-biter nickname, but exhibits says that makes third graders yell."
    - "USNM ENT 00491872\nOrder Hemiptera; Family Reduviidae\nwheel bug, adult female; det. A. Patel 2018\nLocality: Montgomery Co., MD, oak edge, UV sheet\nCondition: rostrum intact; right foreleg missing tarsus."
    - "Row cover order arrived late, and by then the cucumber patch already had striped cucumber bug damage. The invoice says expedited, which is funny in a sad little farm way. I stapled the packing slip to the crop log so next year I remember to order before the first yellow beetles show up."
    - "2024-05-02 pantry moth 2\n2024-05-03 tiny brown bug near rice bin\n2024-05-05 flour discarded, shelf washed\nmanager note: customer brought one bug in tape, too crushed for ID, likely stored-product beetle."
    - "During the arthropod sorting warmup, one student wrote that the bug has eight legs, and the margin note says count again. The drawing looks more like a tick than any classroom insect card. During review, the teacher added a sticky note that says use this one for the arthropod sorting lesson, not the insect quiz, because half the class copied the same mistake."
    - "product review 2 stars: humid window kit failed; gnat-control sticky bug trap caught gnats but curled up after one humid night. The glue strip also stuck to the window frame. Seller replied that the trap is indoor only, but the listing photo shows it on a porch beside a basil pot, which is why everyone in the comments is arguing about humidity."
    - "Block C peaches have fresh catfacing scars near the hedgerow, and the consultant thinks plant bug pressure spiked after mowing. Sweep counts looked low, but the damaged fruit is not subtle. Next pass starts at the border rows, not the pretty middle rows."
    - "Lake cabin was clean except for one shield-shaped stink bug in the folded towel. We took it outside with a postcard and then checked every towel like fools. The guestbook has three pages about fishing and one note from last August that just says do not squash the stink bug indoors."
    - "crop,pest,threshold\nsoybean,brown stink bug,9 per 25 sweeps\ncotton,tarnished plant bug,consult local guide\npeach,stink bug,check local fruit guide\nsidebar: subscribe to pest alerts"
    - "Message from Nina: bring the magnifying jar, Arlo found a blue insect on the compost lid and keeps calling it his blue bug. He has named it Rocket and refuses to accept that it may leave before lunch. Also bring the old field guide, not the glossy one with missing pages."
    - "The little green bug hid under a bean leaf while rain tapped the garden pail. When the sun came out, it opened its tiny wings and climbed past three shiny drops. Inez whispered hello, bug, and the bug kept walking like it had an important picnic to reach."
    - "SRT auto captions\n00:02:11,400 --> 00:02:14,100\nand this tiny insect, this bug is drinking from the flower\n00:02:14,100 --> 00:02:17,000\nyou can see the beak tucked under the body\n00:02:17,000 --> 00:02:20,200\nthat is how true bugs feed, they are not chewing leaves here"
