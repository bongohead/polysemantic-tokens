    - "Hotel claim packet includes receipt, bite photos, and a taped bed bug sample. The photocopy made the bug look like coffee grounds. Page 2 has the guest timeline: checked in 8:40, noticed spots on sheet at 11:15, called desk after finding insect near pillow seam, moved rooms after midnight. Management response says third-party pest inspection found no active infestation, but the attached invoice only covers lobby and room 218, not the original room 216. The guest circled that mismatch twice. A travel-site printout is stapled behind the claim with comments about breakfast and parking mixed into the pest complaint, so the paragraph about bug sample custody lands between waffle machine and late checkout. The credit-card dispute form asks for merchandise category, and someone wrote lodging/pest in the margin."
    - "Aquarium plant shipment came with a tiny water bug tucked in the roots. Forum replies split evenly between 'free food' and 'absolutely quarantine that'."
