    - "09:14 PAY-4821 reopened, checkout total doubles after coupon edit\nowner: Mina\nseverity: high\nnotes: same bug reported by three merchants\nlinked refunds: 18\nmerchant_117: coupon edited after partial authorization, total recomputed from stale cart snapshot\nmerchant_204: same path but no refund because auth failed\nmerchant_311: duplicate receipt email only\nQA note: regression test exists for removing item, not editing coupon. Finance asked for affected order IDs before noon."
    - "// src/cart/totals.ts\n// bug: gift-card balance is subtracted before tax recalculation\n// repro: apply coupon, add gift card, edit coupon amount\n// expected: recompute tax after discount changes\n// actual: taxBeforeDiscount reused from previous cart snapshot\n// bug is hidden when coupon is removed entirely because cart snapshot is rebuilt\n// bug is visible only when coupon value changes and gift card remains attached\n// add cases for percent coupon, fixed coupon, store credit, and gift card split tender\n// assertion should compare tax lines, grand total, and printable receipt total\n// keep failing fixture merchant_117 until tax service patch lands\n// do not normalize totals in the test helper; that masked the bug in February\n// include refund preview because it reads the same total object\n// include receipt preview because support screenshots use that path\n// TODO remove merchant_117 fixture after generalized cart mutation matrix lands"
