    - "Elementary rubric for insect unit: identifies body parts, labels legs correctly, includes habitat, and uses bug examples from the classroom cards. Glitter wings allowed only if anatomy is still visible. Student sample at bottom shows eight legs again, and the teacher note says please count before gluing."
    - "Porch camera clip from 11:48 pm shows a June bug bouncing into the doorbell, hanging there like a bad delivery driver, then falling off the frame. Motion alert marked person and sent three push notifications before midnight. The shared clip has the neighbor's comment underneath: same beetles are hitting their kitchen screen every night since the porch bulb was changed."
    - "is this pantry insect a rice bug?? it was in the measuring cup and now my skin feels weird. pest company says stored-product beetle, which sounds calmer than what I texted my husband. I threw out flour, rice, pancake mix, and possibly my ability to trust shelves."
