    - "Under the porch light, one pale green shield bug kept circling the bulb until it landed on the screen and folded itself flat like a tiny paper shield. The camera app labeled the clip moth, but the still photo shows the pointed shoulders clearly enough for three neighbors to vote shield bug."
    - "FAQ page collapsed under cookie banner\nCan I see them? Adult bed bug is reddish brown and flat before feeding.\nDo bites prove infestation? no, inspect seams.\nShould I throw away mattress? usually no, ask inspector first.\nA parent comment asks whether one dead bug in a suitcase means the whole room is infested; the answer says save the specimen, photograph seams, and avoid moving bags through the hallway."
