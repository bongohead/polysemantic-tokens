    - "Spider unit note from substitute: during arthropod discussion students may say bug, but vocabulary card distinguishes insect, arachnid, and crustacean. Class examples include beetle, pill bug, spider, and crab, which made the sorting chart louder than expected. The teacher added do not grade playground language as science vocabulary unless the worksheet asks for exact groups."
