    - "blood smear teaching file\nTarget cells present, occasional sickle cell forms, polychromasia mild.\nStudent note says red blood cells look like moons; instructor wrote use morphology terms.\nThe LMS preview duplicated the white blood cell differential table under the image, then clipped the platelet comment."
    - "Basal medium for mammalian cell culture\nRecommended for primary epithelial cells and low-serum growth conditions\nStorage 2 to 8 C\nRelated products inserted mid-table: cell scraper, cell freezing medium, cell counting slides\nreview comment says bottle arrived warm but cells recovered after medium change"
    - "root tip lab\nCount cells in interphase, prophase, metaphase, anaphase, telophase.\nTable row 3 missing because staple shadow covers it.\nStudent wrote cell division is fastest in the root cap, but the teacher note says meristem cells are the ones actively dividing."
