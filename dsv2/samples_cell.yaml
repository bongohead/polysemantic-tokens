    - "The knockout reduced epithelial cell polarity and increased cell extrusion at the wound boundary. The authors also report cellular debris in the lumen, but the reviewer asks whether the debris is apoptotic cells, shed matrix, or segmentation artifacts from the imaging pipeline."
