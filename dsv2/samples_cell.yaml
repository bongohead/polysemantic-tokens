    - "incubator incident memo\nShelf 2 warmed to 41 C during alarm test. The fibroblast cells in flask F2 rounded up, but the epithelial cell culture on shelf 4 looked normal. QA asked for photos before discard; the image folder has thumbnails, then a copied vendor banner advertising cellular imaging service. The follow-up note says repeat the cell viability assay Monday because the first count was taken after cells sat in room-temperature PBS for thirty minutes. Incident report v2 adds that incubator shelf labels were swapped during cleaning, so the cell culture log may list the wrong flask position. A pasted email from facilities says temperature probe 2 was calibrated, then a lab manager writes in all caps that calibration does not rescue stressed cells. The final checklist asks staff to photograph cell morphology before discard, record passage number, and quarantine any shared medium bottle touched during the alarm."
    - "We agree that the original phrasing overstated cell fate conversion. In the revised Figure 4, we separate proliferating cells from differentiated cells using EdU and marker staining, and we report cell-cycle phase for each cluster. The reviewer also asked whether cellular stress caused the observed marker shift; we added heat-shock controls and one panel showing cell death remained below baseline. The converted PDF then inserts Table S3 between the paragraph and the citation list, so the answer reads as if cell fate, cell-cycle phase, and heat shock are all one endpoint. A coauthor comment says to restore the sentence explaining that each single cell trajectory was filtered for low coverage. Another margin note asks whether the old cell line authentication result should be cited, because the reviewer hinted at contamination without saying it directly."
