- token: " cell"
  meaning_label: "cell_phone"
  text_samples:
    - "Turn left at the pharmacy sign, then call my cell if the alley gate is shut. The map pin lands behind the bakery, and the delivery note says drivers keep circling because the apartment numbers are painted on the side door, not the street door."
    - "<div class='promo'><h2>Keep the number, change the plan</h2><p>Bring any unlocked cell phone and leave with talk, text, and data today.</p><ul><li>SIM kit included</li><li>No activation fee online</li><li>Spanish support at checkout</li></ul><aside>ad slot repeats cell phone trade-in even when trade-in is not selected</aside></div>"
    - "Ticket holders may display the barcode on a cell phone or printed pass. Screen brightness should be raised before reaching the door, and staff will scan again after intermission for re-entry. The mobile page puts parking, seat map, and weather notice above the ticket, so ushers ask patrons to open the actual barcode before joining the line. Accessibility note says a cell phone screen reader can read the section label but not the rotating sponsor banner."
    - "The tripod clamp holds a cell phone in portrait or landscape mode, and the cold shoe mount leaves room for a small microphone. Reviewer photos show the spring latch beside three common case sizes. The product table lists maximum cell phone width, thread size, and remote shutter compatibility, but the cached mobile page repeats the Bluetooth pairing paragraph under the warranty text. One buyer asks whether a basic cellphone can use the shutter button; the seller answers that the button requires camera-app Bluetooth support."
    - "Mara let the cell vibrate twice before she looked down. The screen showed her sister's name, then no name, then the low-battery warning that made everything feel official. She turned the cell phone face down beside the diner napkins and kept reading the letter."
    - "Marta sent three flower photos from her cell while standing in the market aisle, then called because the white lilies looked yellow under the store lights. The shared album later renamed every upload mobile image, so nobody could tell which cell phone picture was the final bouquet."
    - "Unlocked 128 GB, minor frame wear, battery health 89 percent. Includes cable, clear case, and SIM pin. Seller says cellphone has clean IMEI, and the cell will be reset at pickup after buyer confirms model number."
    - "Oral history archive, tape 4: Mrs. Alvarez remembers the first cell phone store opening beside the laundromat, before the block had a coffee shop or pharmacy. The transcript notes laughter when she says everyone called it the tiny phone place. A photo caption from the archive lists three teenagers sharing one cell outside the bus depot."
    - "photo_001 lobby entrance\nphoto_002 package room\nphoto_003 taken on tenant cell phone, timestamp off by 3 hours\nadjuster note: ask for original cell phone photo metadata before updating the building file\nemail footer repeats upload from mobile app"
    - "customer: does this charger work with a basic cell phone\nclerk: USB-C, yes if the port is shaped like the sample on the box\ncustomer: I only need it for calls\nclerk: then skip the fast charger, cheaper one is fine"
    - "Do not give the flashlight app access to your cell phone contacts. It does not need them, it never needed them, and the permission screen hiding behind continue is exactly why people stop reading."
    - "Evidence intake requires a photo of the cell phone exterior, SIM tray, and lock screen notification count before the device is sealed. The checklist also asks for carrier name, visible cell number if shown on the emergency screen, and whether the device was powered on when collected. A copied form paragraph repeats phone contents twice because the PDF merged object description and container description."
    - "The new calendar view is readable on my cell phone without zooming, and the reminder badge finally fits on one line. Developer reply asks for cell phone model only if widgets still overlap after refresh."
    - "patient_id,visit_type,reminder_cell,last_sms,portal_status\nP044,post-op wound check,555-0181,delivered,active\nP045,diabetes class,555-0127,failed,no portal\nP046,transportation voucher,,not_sent,paper only\nNurse note says reminder_cell is the patient's cell phone when available, not the caregiver number unless proxy consent is scanned."
