    - "Panel A: cell spreading on soft gel\nPanel B: cell spreading on stiff gel\nPanel C: traction map\nQuestion from audience: did you normalize by cell area or by total force?\nPresenter note says add one slide about cellular adhesion before the model equations.\nA photo of the poster cuts off the y-axis, and the live Q&A transcript repeats cell area when the presenter meant substrate area. The downloaded abstract lists cell spreading twice because the poster title was copied into keywords."
    - "file 1842_A.tif oversegmented at colony edge\nfile 1842_B.tif missed dim cells near scratch\nfile 1842_C.tif one giant cell object covers debris\nanalyst note: retrain with more low-contrast cell examples from day 5 wound assay\nmask export below shows cell_id 88 duplicated after manual split, which explains the impossible cell area in the summary plot."
    - "methylene blue lab\nyeast cells counted with stain\nlive cells clear, dead cells blue\nhemocytometer grid smudged in quadrant 4\nTA note: report cell concentration as cells per mL and show dilution math, not just final answer"
