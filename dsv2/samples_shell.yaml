    - "After the battery opened on the town, the first shell passed over the roof with a sound like a door tearing off its hinges. No one in the cellar knew whether it had landed close or far away until grit sifted through the boards. By morning the lane had a new hole, perfectly round at the lip, and Mila kept saying it looked too neat to be real. The chapter draft has a margin note from the editor asking whether the second shell should arrive before the church bell stops, because the timing in the next scene makes the rescue impossible."
    - "The class book says armies used bigger guns as trenches spread. A drawing shows a crew pushing one shell toward the breech while two men cover their ears. In blue pen, someone answered that the shell was not just heavy; it carried the blast farther than a cannonball. The teacher circled carried and wrote better: delivered explosive force."
    - "I checked other because the roof hole faced the training range and was not hail, not wind, not a branch. The adjuster kept asking for storm photos until I wrote artillery shell damage in the comments and attached the range map from last summer. The neighbor still says it was noise, not metal, but the roof board has a punched edge and the county finally sent the file to liability review."
    - "...war diary roads impassable after midnight. Heavy artillery shelling on the ridge until 0310, then silence except for single shell bursts west of the orchard. Rations delayed. Engineers request two wagons of plank before dawn."
