    - "Why did soldiers dig deeper shelters after the artillery improved?\nA shell could break above ground and send metal sideways, so sandbags and timber mattered. Draw one trench feature, not the explosion. Vocabulary box: fuse, shrapnel, dugout. A student added too loud in the margin beside the picture of the gun crew."
