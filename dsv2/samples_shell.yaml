  meaning_label: "command_line_shell"
  text_samples:
    - "1. Type `pwd` in the terminal and press enter.\nANSWER KEY: current directory\n2. The command shell prints the current folder.\n3. Type `ls` to list files.\nstudent note: is the command shell the black window or the thing inside it\n4. Type `clear` if the screen is messy."
    - "FROM alpine:3.20\nCOPY entrypoint.sh /usr/local/bin/app-entrypoint\nRUN chmod +x /usr/local/bin/app-entrypoint\nENTRYPOINT [\"/bin/sh\", \"-c\", \"app-entrypoint\"]\nAlpine starts the command through the BusyBox ash shell, so keep the entrypoint POSIX-compatible."
    - "user: marta\nold login shell: /bin/bash\nnew login shell: /usr/bin/zsh\nreason: requested zsh prompt and completion\nstatus: complete\nNext login should start the new shell automatically."
    - "dev@staging:~/app$ echo hello\nhello\ndev@staging:~/app$ date\nTue May  5 14:11:03 EDT 2026\ndev@staging:~/app$ history | tail -3\nThe login shell history is saved at logout on this host, so commands from another open terminal are not visible yet. The training video transcript keeps calling the prompt a cursor."
    - "Python command shell wrapper:\ncmd = tar -czf backup.tgz uploads && rm old.tmp\nsubprocess.run(cmd, shell=True, check=True)\nreturncode=2\nstderr=/bin/sh: 1: rm: not found\nSecurity review note: using shell=True here also makes quoting fragile."
    - "QA room, 4:58 PM\nRin: pwsh step passes\nAbe: cmd shell step fails with The system cannot find the path specified\nRin: paste cwd\nAbe: C:\\Windows\\System32, why is it there\nPowerShell shell session says C:\\build\\work\nAbe: I am going outside for exactly four minutes"
    - "Sam 10:03: anyone using fish locally?\nNoor: yes, my fish shell expands ** differently unless I enable the plugin\nSam: CI uses bash shell, so the glob works there\nNoor: great, so my terminal is the weird one again\nMila: use `find` in the script if you want portable behavior"
    - "SHELL := /bin/bash\nexport NODE_ENV=production\nbuild:\n\tpnpm build\nrelease:\n\tpnpm version patch && pnpm publish\nThe Make manual says recipes are passed to the command shell one line at a time unless `.ONESHELL` is set."
    - "[Service]\nEnvironment=SHELL=/bin/bash\nExecStart=/bin/sh -c 'cd %h/sync && ./run.sh'\nRestart=on-failure\njournal tail says shell exited with status 127 after the NAS mount moved. Fix the mount path before changing the service shell."
