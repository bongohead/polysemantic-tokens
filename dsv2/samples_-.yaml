    - "partitions P subset Q, U(f,P) - L(f,P) >= U(f,Q) - L(f,Q). Indeed U(f,P) - U(f,Q) >= 0 and L(f,Q) - L(f,P) >= 0, so subtracting the two refinements yields the displayed inequality. As mesh(Q) tends to 0, I^+(f) - I^-(f) = 0."
    - "For 0 < s < 1, write [f]_{H^s}^2 - [g]_{H^s}^2 = integral ((f(x) - f(y))^2 - (g(x) - g(y))^2) K(x,y) dx dy. Factoring gives ((f - g)(x) - (f - g)(y))((f + g)(x) - (f + g)(y)); Holder bounds the difference by ||f - g||_{H^s}(||f||_{H^s} + ||g||_{H^s}). The localized version replaces f by eta f and subtracts eta(x) - eta(y), so the commutator term is controlled by ||eta f - eta g||_{H^s} plus ||f - g||_2."
