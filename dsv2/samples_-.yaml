    - "Let P_t be the heat semigroup. Since P_t f - P_t g = P_t(f - g), contractivity gives ||P_t f - P_t g||_2 <= ||f - g||_2. Moreover P_t f - f = integral_0^t P_s Lf ds, so ||P_t f - f||_2 <= t ||Lf||_2. Apply this to f_k - f. The diagonal estimate then splits P_t f_k - f into P_t f_k - P_t f, P_t f - f, and f_k - P_t f_k; choosing t after k removes the last two differences. The same bound with g_k - g gives ||P_t(f_k - g_k) - (f - g)||_2 after adding and subtracting P_t f - P_t g."
    - "R_n(phi) = E_n(phi) - E(phi); decompose R_n(phi) = [E_n(phi) - E_n(phi_0)] + [E_n(phi_0) - E(phi_0)] + [E(phi_0) - E(phi)]. The first and third terms cancel after adding Q(phi) - Q(phi_0)."
