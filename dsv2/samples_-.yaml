    - "Proposition 2.1. Let Z_i = X_i - Y_i and barZ_n = barX_n - barY_n. Then n Var(barZ_n) = sigma_X^2 - 2 sigma_XY + sigma_Y^2. The plug-in covariance is n^{-1} sum_i (X_i - barX_n)(Y_i - barY_n), hence V_hat - V is o_p(1). Expanding the quadratic term gives (Z_i - barZ_n)^2 = (X_i - barX_n)^2 - 2(X_i - barX_n)(Y_i - barY_n) + (Y_i - barY_n)^2, and the remainder A_n - B_n is absorbed into R_n - R. Uniformity follows because sup_phi |A_n(phi) - A(phi)| - sup_phi |B_n(phi) - B(phi)| is bounded by Delta_n - delta_n."
    - "The coercivity estimate uses a(u,u) - a(v,v) = a(u - v,u) + a(v,u - v). With w = u - v, ellipticity gives lambda ||w||_H1^2 <= <F(u) - F(v),w>. Thus ||u - v||_H1 <= C ||F(u) - F(v)||_H^{-1}, and compactness gives u_j - u in L2. Passing to the Galerkin subsequence, a(u_j - u_i,u_j - u_i) <= <F(u_j) - F(u_i),u_j - u_i>; the residual R_j - R_i vanishes after projection, while the boundary trace tau u_j - tau u_i is controlled by compact embedding. For the limiting pair, testing with u - v gives J(u) - J(v) <= <F(u) - F(v),u - v>."
