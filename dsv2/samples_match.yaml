    - "...with the lamp smoking and only one match left in the tin. He held it too long before striking, as if delay could make the room warmer. The stair below him creaked, then another, and the wind pressed rain through the cracked sash hard enough to bead on the sill. When he finally dragged the match across the box it flared blue-white, showed his sister asleep under both coats, showed the bread knife on the chair, showed the letter folded open on the floor. He cupped the match until the sulfur bloom steadied, then touched it to the wick and whispered sorry to nobody in particular. The flame made the wallpaper flowers tremble. Outside, the horse coughed once in the shed, and the matchbox, empty now, felt absurdly loud when he set it down beside the chipped saucer."
