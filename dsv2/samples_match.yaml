    - "I thought the candle-drawer matchbox was empty because the flap was open and the kids had used it as a tiny garage for Lego wheels. Then Noah came in whispering that Tessa made smoke in the sink. There was one match stuck behind the staple, just enough red on the head to catch when she scraped it on the side. She dropped it in a cereal bowl and cried harder than I did. So yes, every match and lighter goes in the high cabinet now, even the souvenir matchbook from the hotel, even the ugly grill matches, even the one you think is dead because it got damp. Poison control number is taped inside the door. The burned towel is in the trash outside. I also checked the camping bin and found loose matches at the bottom under batteries, which is how you learn your emergency kit is secretly a junk drawer with a handle."
