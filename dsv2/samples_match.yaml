    - "Visitors usually notice the smell before the cases: a dry mineral bite from old striker paper, varnished pine, and the sulfur-colored labels stacked behind glass. The guide says the town stopped making lucifers after two fires and moved to the safety match design, with the red phosphorus kept on the box instead of the head. A wage token from the matchbox factory sits beside a burnt apron button, and the caption lists two strikes in 1894, one over pay and one after a foreman searched lunch pails for stolen matches. Someone has written in pencil on the photocopy, ask Mr. Havel about girls packing 600 boxes/day, because his aunt did it until the match dust made her cough. The school worksheet below asks pupils to label match head, splint, and striker, but half the arrows point to the wrong side of the box."
