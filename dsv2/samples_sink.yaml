- token: " sink"
  meaning_label: "plumbing_fixture"
  text_samples:
    - "Work order 44812: tenant reports water pooling under the kitchen sink after disposal runs. Cabinet floor swollen near left hinge, trap joint damp, and shutoff valve handle is stiff. Tech should bring 1-1/2 slip nut kit and check whether the sink strainer is loose before replacing the disposal. Resident added two photos: one shows bucket under sink, the other shows dishwasher hose entering disposal. Prior ticket 44109 says same sink backed up during holiday weekend and was cleared with hand auger. Dispatch note pasted below the wrong unit number says do not remove sink base panel without owner approval. Mobile footer repeats emergency maintenance phone three times, then cuts off plumber ETA. Tenant also says kitchen sink smells after washer drains upstairs."
    - "Line cook prep list\nsanitize cutting boards\ncheck hand sink soap dispenser\nmop sink has gray bucket left inside\nbar sink drain smells after closing\nmanager initials: ___\nold laminated copy still says three-comp sink must air dry overnight.\nDish lead note: left sink at dish pit fills slowly when sprayer runs, probably grease screen. Health inspector last month wrote hand sink must stay clear during prep; do not stack sheet pans there even if rush starts early. The printed list has pastry inventory on the back because someone reused paper. Footer from scheduling app interrupts: approve timesheets / approve timesheets / break policy. Closing cook added in pencil that the bar sink gurgles when patio tubs are dumped, but manager crossed it out because bar closes separately."
    - "<div class='buybox'>30 in stainless undermount sink / rear drain / 16 ga</div>\nCustomers also bought: faucet mat, cabinet liner, lemon soap\nQ: does sink include grid? A: yes, grid and basket strainer. Review 2 stars: beautiful sink but template was off and the sink corner radius is NOT like photo, had to recut stone, still mad."
    - "fixture_schedule.csv\nroom,fixture,type,notes\n101,lav_1,bathroom sink,slow drain\nkitchen_A,ks_2,prep sink,left bowl only\njanitor,mop_1,mop sink,missing splash guard\nlab3,ls_1,lab sink,acid-resistant trap requested"
    - "[08:12] dina: water standing again, not tub\n[08:14] dina: bathroom sink backing up again\n[08:16] maint: stop using sink for now"
    - "...dry fit before silicone. Set the sink into opening, check clip reach, lift back out if the sink rocks. OCR from install sheet repeats WARNING twice, then a cookie banner covers the diagram. Hand note on printout: laminate crumbs under left sink flange, do not blame caulk."
    - "night audit cleanup list: room 214 vanity sink lipstick; 219 sink stopper missing; lobby left sink drips"
    - "Lab closeout checklist\n- rinse glassware before leaving\n- keep solvent waste out of sink drains\n- wipe around the lab sink after agar cleanup\n- report any cracked sink basin to facilities\n- leave sediment trap below teaching sink in place\nFooter copied from 2019 safety PDF.\nTA comment from LMS export: students keep dumping sand into the lab sink after erosion demo, and the sink trap is not a trash filter. Facilities invoice from March is pasted under the checklist with two charges for clearing sink drain. The LMS page also includes unrelated quiz dates between the sink rules and the chemical hygiene link. A parent volunteer reply appears at bottom asking whether art brushes can use the lab sink; instructor answered no, use the utility sink in room 102."
    - "I replaced the P-trap under the bathroom sink and now the tailpiece is about half an inch too short. The old sink drain had a weird extension glued on, maybe from the previous vanity. Can I use a slip-joint extension or do I need to change the sink strainer too?"
    - "Charming bungalow with updated counters, apron-front kitchen sink, and tile backsplash. Upstairs bath has pedestal sink and original medicine cabinet. Basement laundry sink is functional but stained; seller will not replace."
    - "INVOICE 7704\nservice trip 65.00\nreset hall sink drain 42.50\nreplace supply under sink 18.00"
    - "ORDER 8841 return window expired banner\nAGENT: cracked vessel sink approved\nCUSTOMER: finally, it arrived broken and you kept asking for faucet pics\nAGENT: pack sink bowl in original foam if possible\nCUSTOMER: the sink rim is chipped, not the drain, see photo 3\nsystem footer: pop-up assembly not required for this return / chat clipped above line 112"
    - "...NOT the bathroom sink. Brushes in deep sink by kiln, clay water outside first. Someone taped PAINT ONLY sign beside wrong sink again, so kids rinsed plaster in the small sink and trap clogged. Janitor note in red marker: bucket strainer gone, not optional, stop making sink mud."
    - "<div class='grid'><h2>utility sink kits</h2><span>two-handle faucet included</span><span>sink base cabinet optional</span><span>related: laundry cart</span><span class='ad'>sponsored towel rack</span><p>Model LQ22 sink ships with drain, legs, and wall bracket.</p></div>"
    - "5/12 cocina recheck sheet, scan crooked\nhand sink sin toallas / soap empty again\nservice sink blocked by crates, owner says delivery only cinco minutos\nbar sink faucet receipt taped to permit board, manana maybe\nphoto labels mixed: rear sink no towels, prep sink clear. Follow-up says soap at hand sink before opening, no excuses."
    - "RFI 22-17 pasted from phone\nsink drain shown 15 in off finished wall but cabinet guy measured 13-1/2. Island vent loop may hit drawer rail. DO NOT glue trap until sink base shimmed. Counter crew wants final sink template Wed; designer changed sink from double bowl to single after framing, of course."
    - "Move-out checklist\nBathroom mirror clean\nsink faucet free of toothpaste\nunder sink cabinet empty\nkitchen sink strainer present\nLaundry sink stained: charge only if cracked\nTenant note in margin: stain was there at move-in. Inspector photo 18 shows bath sink stopper missing; photo 19 shows cabinet under sink with cleaning bottles left behind. The export repeats kitchen sink strainer present under appliances because the mobile form duplicated sink fields. Manager says do not charge for porcelain chip unless sink leak is active. Old lease paragraph about smoke alarms appears below this section for no reason. Dispute reply says kitchen sink strainer was in drawer, not missing, and bath sink stopper broke during prior maintenance visit. Reinspection changed sink charge to zero."
    - "Child care inspection p.2 OCR\nhand washing sink in toddler room OK\nfood prep sink separate from diaper sink\nservice sink faucet vacuum breaker missing\nparent notice / parent notice / page footer 3 of 8\nCorrective action column got cut off, but margin note says repair service sink breaker before license renewal. Director initialed the wash sink line after adding paper towels."
    - "gray tank drains slowly if folding sink is full. Outdoor sink hose needs washer and little sink pump sounds like chewing gravel. Packing list below: basin plug, spare hose clamp, bleach tabs. Hand circle around sink twice; last trip the sink drain leaked into lower cabinet."
    - "BIM export F-221\nfamily,type,mark,comment\nLavatory,wall sink,LAV-03,ADA knee clearance\nKitchen,prep sink,KS-01,owner selected stainless\nJanitor,mop sink,MS-01,add wall guard\nLab,lab sink,LS-07,verify epoxy counter cutout"
    - "Routine inspection page 4, food court north\nhand sink at taco counter blocked by soda crates\nprep sink sanitizer test strips expired\nmop sink backflow device installed but no tag\nthree-comp sink air-dry rack clean\nad banner inserted between rows: lease kiosks now\nCorrection: sushi stall has separate rice sink, not shared with produce."
    - "Tenant portal message from 5C: cabinet under sink smells like mildew, and the sink faucet handle squeaks when turned hot. Photo upload shows bucket under trap, not overflow. Resident says old ticket was closed because no leak was visible during dry weather."
    - "1 star update, seller hid my first review: matte black bar sink arrived with bent rim, box fine, sink corner flattened so drain basket rocks. Chat keeps asking for faucet photos even though faucet was NOT in order. Photo upload #4 shows sink lip bent; support bot replies attach sink damage photos, thanks."
    - "loss: supply line burst below hall bath sink\nvisible damage: vanity toe-kick swollen, sink base particleboard delaminated, drywall stain behind trap\nexclude: preexisting crack in porcelain sink bowl\nphotos 12-18 uploaded twice by app\nadjuster initials missing on second upload"
    - "exam_room_2:\n  fixture_count: 3\n  sink: handwash_left\n  faucet: wrist_blade\n  drain: grid_strainer\nexam_room_3:\n  sink: handwash_right\n  note: verify splash guard before clinic opens\nfacilities_export: room 3 sink missing tempered valve tag\ninstaller comment: do not share sink drain with sterilizer condensate"
    - "> stone shop left before measuring, of course\n> new countertop, old sink clips do not reach\nMine did the same. The sink rail was lower than the template showed, so the installer added wood blocks inside the cabinet. Do not overtighten or the sink lip flexes.\npage 7 footer: login to reply / quartz ads"
    - "Hotel PM passdown: lobby restroom left sink slow, men's room right sink cracked around drain, pool bar sink full of lime wedges after wedding. Put 303 on out-of-order if the vanity sink keeps dripping. Night auditor added guest complaint about brown water at sink faucet, but maintenance says it was rust from shutoff repair. Check pool bar sink before breakfast shift."
    - "Laundry room sign draft\nPlease wipe lint from utility sink after soaking filters.\nPaint brushes are not allowed in sink basin.\nReport standing water around sink legs to facilities.\nFooter: building committee 2022"
    - "18-441 / kitchen remodel: relocate sink to island, add air gap, cap old sink vent at north wall. Contractor drawing shows sink centerline 42 in from pantry cabinet. Inspector wrote verify island sink loop vent on rough inspection. Scan footer cut off license number."
    - "[front door noise]\nAGENT: dishwasher is new, sink is original but deep.\nVISITOR: does the disposal work?\nAGENT: yes, but the sink sprayer sticks sometimes.\nVISITOR: bathroom sink looks low.\nAGENT: vanity is standard, mirror is just high.\ntranscriber note appears twice: hallway noise"
    - "counter crew pickup, bin 4: sink basket strainer x2, sink clips x12, lav pop-up x1, 18 inch braided supply x4. Backorder warning only applies to farmhouse sink grid, not the drain kit. Counter note says customer keeps asking for the sink faucet too, but faucet was purchased elsewhere. Bin label printed wrong SKU for sink clips and had to be corrected by hand."
    - "<table><tr><th>room</th><th>fixture</th></tr><tr><td>science 201</td><td>lab sink with eyewash</td></tr><tr><td>janitor</td><td>service sink</td></tr><tr><td>nurse</td><td>exam sink</td></tr></table><aside>related: tile repair</aside>"
    - "Cleaning contract addendum: wipe sink fixtures daily, scrub staff sink weekly, and descale breakroom sink faucet monthly. Contractor is not responsible for sink drain clogs caused by coffee grounds. Attachment A lists restroom sink counters separately from kitchen sink basins, but the scanned copy puts both under fixtures. Supervisor initials required after Friday sink scrub."
    - "Clinic punch list\nRoom 4 exam sink splashes chart rack\nRoom 5 sink soap bracket missing\nSterile processing sink needs wall guard\nPublic restroom sink sensor runs too long\nNurse note: do not store specimen cups under sink."
    - "photo 5 uploaded sideways, but counter seam beside sink opened after only two months and I am so tired. Installer says water sat around sink rim; caulk had bubbles from day one. Warranty page says undermount sink failures require pictures before removal, then the upload form crashes after photo 5. Screenshot caption: sink seam gap wider near faucet."
    - "REPAIR CSV export\ndate,unit,fixture,action\n2026-04-14,2A,kitchen sink,clear trap\n2026-04-15,2A,kitchen sink,reset disposal\n2026-04-16,2B,bath sink,replace stopper\n2026-04-17,common,mop sink,install grate\nnotes column lost during export; dispatcher says 2A sink odor persists and common mop sink still needs splash guard."
    - "search chips after banner: white fireclay sink 33 inch | apron sink grid | sink drain bronze\nCookie banner covers dimensions table; product card underneath says rear drain. Review #12 says the sink is beautiful but too heavy for an IKEA base. Related search chip repeats sink cabinet, sink cabinet."
    - "Dishwasher install note: loop drain hose high before entering sink tailpiece. If the sink has a disposal, knock out the plug first. Customer's old sink flange is chrome; new faucet is brushed nickel. Installer photo shows hose dropping below cabinet rail before sink tailpiece, so callback likely. Manual page pasted below has sink diagram but no local code note."
    - "bright kitchen with stone counter and deep sink facing garden. Alt text: stainless sink and pull-down faucet, but image actually shows white enamel sink with left drainboard."
    - "From: facilities@northcampus\nSubject: Friday fixture sweep\nThe plumbers will start in B wing because the mop sink near receiving has no hot water and the hand sink by dish return failed the temperature check. After lunch they will move to the lab corridor, where room 114 has a chipped epoxy sink and room 117 needs a new sink trap. Please clear boxes from under sink cabinets before 9 a.m. The old janitor closet list is wrong; there is no floor sink in 1B, only the wall-hung mop sink behind the cart rack. A copied reply from chemistry says the lab sink in 119 also smells, but that ticket is on a different waste line. Calendar footer wedged into message: boiler inspection Monday, parking lot closed Tuesday, submit requests through portal / do not reply / submit requests through portal."
    - "left wall has exposed supply, contractor to install service sink after tile. The drawing still labels it utility basin, but procurement ordered a stainless sink with wall bracket and lever faucet. Site photo shows tile crew covered the sink backing plate with waterproofing membrane. RFI asks whether service sink can shift 4 inches to clear conduit."
    - "Restaurant complaint photo comments: prep sink full of lettuce boxes, hand sink blocked by trash can, and mop sink hose lying on floor. The inspector circled all three sink areas in red and wrote repeat violation."
    - "tiny house listing cached from mobile\nfolding counter over sink\nsink pump 12V, gray tank 19L\nbath module has corner sink, compost toilet, no shower\nrelated ads: solar fan / mattress / cargo trailer\nseller reply says kitchen sink drains slower when trailer nose is low."
    - "Unit 12B turnover\nremove hair from bath sink stopper\nreplace cracked sink escutcheon\nseal gap behind kitchen sink\ncheck under sink shelf for mouse droppings\nphotos uploaded in wrong order; first image is closet, not sink."
    - "Dear customer,\nClaim denied: discoloration around copper sink drain attributed to abrasive cleaner. Sink bowl finish intact under rim. You may purchase replacement sink grid at 15% discount.\nCustomer reply pasted below in all caps says the sink arrived spotted and nobody used cleaner yet; attachment names: sink-brown-ring.jpg, receipt-sink.pdf."
    - "School nurse renovation scope: add exam sink near cot area, keep existing staff sink, remove old drinking fountain, and verify sink water is tempered. Architect note says sink cannot share counter with medication fridge."
    - "fragment from permit PDF\nlavatory count revised 3 to 4\naccessible sink clear floor space shown dashed\nbreakroom sink vent tied to existing stack\njanitor sink receptor omitted on first sheet\nPAGE 11 repeated footer / city planning / file 22-381"
