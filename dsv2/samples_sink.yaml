    - "<article><h2>Compact heat spreaders</h2><p>The copper block is not a heat sink by itself; it moves heat into the finned sink attached to the rear plate. In fanless mode, the sink stores heat briefly, then dissipates it through the case.</p><aside>Product ad inserted here: quiet fans, RGB cable, thermal paste.</aside><p>Test table lists sink mass, sink area, case temp, ambient. Heavier sink delayed throttling but did not fix steady-state temperature. Comment 12: sink screws bottomed out before pad compressed.</p><pre>sink_mass_g, sink_area_cm2, case_temp_c\n184, 72, 66\n231, 94, 63</pre><footer>Cached table repeats heat sink area twice. Mobile view hides heat sink test chart.</footer></article>"
