    - "The vanity top looked fine until we set the sink bowl on it. The sink hole was off center by nearly an inch, and the faucet holes lined up with the mirror frame. Installer blamed template, template guy blamed sink spec."
    - "public restroom audit\nwest park: left sink sensor dead, right sink OK\nlibrary: child-height sink loose at wall\npool house: outdoor sink winterized\nstadium: sink counters stained but serviceable\nsame header repeats every page"
    - "after photo 8, zoomed\nnew quartz counter, single basin sink, black faucet, soap hole capped\nbefore photo below shows old double sink with rust ring\ncomments collapsed: where did you get that sink grid / is sink 30 or 32 / paint color?"
    - "Plumber's scratch pad\ntrap arm too long at coffee sink\nbar sink backs up if ice well dumps fast\nowner wants sink sprayer moved left\nbring 2 wax rings too, unrelated\nreceipt tape faded, re-enter sink labor manually"
    - "Health department OCR export, page 2 of 5\nObserved employee rinsing towel in food prep sink. Hand sink in rear prep room lacks paper towels. Three compartment sink sanitizer at 0 ppm. Mop sink inaccessible due to stacked flour buckets. Corrective action: train staff that each sink has assigned use. NAV HOME CONTACT PERMITS appears between findings. The mobile copy duplicates hand sink line twice and loses the inspector signature."
    - "warehouse note from noon: cabinet order says sink base 36, blind corner 42, drawer stack 18. Designer says apron sink needs shorter doors. Warehouse pulled regular sink base by mistake, so the front panel will not clear. Delivery ticket has sink base circled and handwritten replace with farmhouse-ready unit. Installer says selected sink also requires reinforced rail."
    - "my landlord keeps sending the same guy who snakes the bathroom sink for five minutes and leaves. Two days later sink water is standing again. The tub drains fine. The kitchen sink is fine. I think the branch line behind the sink wall is the issue."
    - "Fixture inventory from old clinic\nRoom A: wall sink, cracked porcelain\nRoom B: stainless sink, knee valve\nRoom C: no sink installed\nLab alcove: deep sink with sediment trap\nAutoclave room: sink faucet missing handle"
    - "Under counter dimensions are tight: sink bowl depth 9 in, disposal adds 7 in, and pull-out trash hits the sink trap. Customer may switch to shallow sink if plumber cannot offset the drain. Field sketch shows drawer runner crossing exactly where sink tailpiece drops. Designer asked for cut sheet before approving new sink depth."
    - "shop page footer got glued to specs\nSKU 44-SS-19 hand sink, 14 x 10 bowl, NSF, wall mount\nCustomers also viewed gloves, aprons, thermometers\nQ&A: does this sink include faucet? yes\nQ&A: can sink mount to tile? use backing plate\nnewsletter signup newsletter signup"
    - "Volunteer kitchen checklist, half torn\ncoffee urn cleaned\nleft sink for produce only\nright sink for dish rinse\nwash sink soap full\nservice sink bucket emptied\nsomeone wrote do not wash paint rollers here beside sink list"
    - "I pulled the old cast iron sink because the enamel was gone and the cabinet smelled awful. Under it, the sink base had two layers of plywood, one wet, one painted over. The new undermount sink came with clips that need a flat rail, but my counter has a weird bevel, so half the clips barely touch. A reply suggested silicone only, another said no way, and then the page inserted three ads for sink strainers before the useful answer. Final fix was blocking screwed inside the cabinet, fresh plumber's putty at the sink drain, and a smaller disposal so the trap lined up. Edit at bottom after three unrelated faucet comments: the sink has held for six months, but I had to shave the drawer back because the sink trap sat farther left than the template implied."
    - "there is still blue tape on the sink faucet in 8A, and the tenant says nobody came back after the countertop crew left. The sink drains, but the hot valve under sink cabinet is shut because it drips. Portal photo shows caulk missing along back of sink rim. Manager note: reopen turnover ticket and verify sink supply stops before move-in."
    - "Food truck permit checklist\nfresh water tank filled\nportable wash sink reaches 100F\nwaste line from prep sink secured\nthree-comp sink labeled wash rinse sanitize\nInspector note: outside service window cannot block the wash sink access."
    - "Museum cafe bid addendum: salvage existing bar sink if drainboard is not pitted. New prep sink must fit below window. Contractor to verify sink rough-in before ordering stone. Attachment list also includes hand sink splash guards, but the PDF split that row across two pages. Curator note says visible sink finish must match old stainless counter."
    - "The imported cabinet spec says 30 inch sink base, but the selected fireclay sink needs 33. The designer changed the sink on Friday and forgot to update the elevation. Email chain shows the stone shop still cutting for the old sink template, and the cabinet installer circled the sink base line item in red. Delivery note says do not unpack vanity mirrors until sink issue is resolved."
    - "Airport restroom punch list: family room sink sensor too sensitive, gate B men's sink cracked, custodial closet mop sink missing hose bracket. Open items copied to night shift board. Facilities app duplicated gate B photo under gate C, so plumber asked for a fresh sink close-up before ordering the lav bowl. Shift note says restroom stays open unless sink leak reaches tile joint."
    - "Mobile home winterization card\nopen low point drains\npour RV antifreeze into kitchen sink trap\nrepeat for bath sink and shower\nleave sink stoppers out\npink stain around utility sink is normal\nOwner scribble says do not forget outdoor sink line behind skirt panel. Spring checklist on back: flush each sink until pink color clears."
    - "build blog day 12, cabinet face still off: the new galley sink is tiny but usable. I can wash one pan if I turn it sideways, and the sink cover doubles as counter space. Drain hose runs to gray tank under the berth. Build blog comments ask whether the sink pump is loud; answer says only when tank is nearly empty. Parts list below has faucet, folding tap, sink strainer, and two hose clamps."
    - "Old catalog OCR\nNo. 441 enamel sink, white, right drainboard\nNo. 442 enamel sink, left drainboard\nNo. 503 pantry sink, nickel plated fittings\nPrices subject to change / freight extra / page 119\nThe scan merges sink dimensions with freight table, so 24 x 18 appears under rail depot. Marginalia says apron sink special order, allow 6 weeks."
    - "From: Mara\nSubject: sink samples\nClient chose the square vessel sink for powder room, oval sink for guest bath, and stainless undermount sink for laundry. Please ask stone shop whether all sink templates arrived."
    - "Warehouse pick ticket\nAisle 8: scrub sink NSF x4\nAisle 8: service sink faucet x2\nAisle 11: sink drain 3-1/2 x6\nAisle 12: sink base white 36 x1\ncustomer pickup 2 pm\nPicker note: one scrub sink carton is torn at corner but bowl is not chipped. Counter staff added sink drain gasket by hand because POS showed zero stock."
    - "Public pool inspection excerpt: outdoor rinse sink has no drain screen, snack bar hand sink OK, chemical room utility sink corroded. Manager signed next to sink correction list and asked for recheck after swim meet."
    - "I thought the pedestal sink would make the powder room feel bigger, but the wall behind the old vanity is a disaster. The sink supply lines come through the floor, not the wall, and the sink drain is off by two inches."
    - "aisle 9 was mislabeled again. Bought sink clips, sink putty, and a cheap basin wrench. Clerk knew exactly which sink strainer fit my old porcelain bowl. Online inventory said aisle 4; actually aisle 9. Receipt survey printed between lines, but the useful part is SKU 3317 for sink gasket. Reviewer adds that the sink clips were in cabinet hardware, not plumbing."
    - "School grant equipment list: two lab benches, one eyewash station, one deep sink with sediment trap, and one hand sink by the door.\nREVIEWER: why can't art room sink be shared?\nTEACHER: clay cleanup clogged the old sink twice; science needs a dedicated sink for soil trays.\nBudget spreadsheet still labels the hand sink as optional, which contradicts code review."
    - "Venue closing checklist after wedding\nbar sink empty\ncoffee station sink rinsed\ncatering prep sink sprayed down\nservice sink bucket dumped\nDo not leave flower stems in sink baskets; they clogged last Saturday."
    - "Subject: leak?\nResident first noticed damp cardboard under the kitchen sink on April 2. Maintenance tightened the trap and closed the ticket. On April 5 the same sink backed up while the dishwasher drained, and brown water came through the air gap. A neighbor replied with a coupon for drain cleaner, then the portal inserted boiler outage updates between comments. By April 9 the bathroom sink in the same unit had started gurgling, which makes this sound like a branch line problem, not a single sink trap. Manager note: plumber scheduled Tuesday, clear items from under sink, do not use kitchen sink after 8 a.m. Mobile view repeats the first photo caption: bucket under sink, bucket under sink, then hides the plumber's invoice number behind the resident rating widget."
    - "Spec fragment\nfixture F-12: hand sink, wall mount, wrist blades\nfixture F-13: scrub sink, stainless, knee valve\nfixture F-14: janitor sink, floor mounted receptor\nall sink drains to receive trap primer where required"
    - "church basement email: left kitchen sink has no stopper, right sink leaks around basket, and the mop sink is full of candle wax. Youth group used the art supplies again, sorry. Forwarded thread includes a volunteer arguing the kitchen sink was clear before Sunday, then a custodian photo shows wax flakes in the sink strainer. Please add mop sink grate to next supply order."
    - "Product comparison table copied without columns\nwhite granite composite sink 31 in quiet pads included\nstainless sink 33 in grid included\ncopper bar sink no overflow\nad: faucet sale\nreview note says composite sink chips near divider"
    - "sterilization rm punch list, photo 14 blurry\ninstrument sink splash panel missing -> room cannot open\nsink too close to autoclave cart; trays hit faucet handle\n11 in clear at sink side, inspector wrote no in margin\nassistant note: patients tomorrow?? need washable wall panel behind sink before final"
    - "From: facilities desk\nSubject: B wing water shutdown\nThe plumber will isolate the line after breakfast. Please move carts away from the scrub sink in room B12 and the hand sink near receiving. The mop sink in the closet by freight elevator has to stay clear because they need the cleanout behind it. If your room has a sink with a foot pedal, test it after service and report low pressure before 3 p.m. The old notice about hallway painting is still attached below, ignore that. Footer: campus facilities / this inbox is monitored / campus facilities."
    - "kitchen-reno-thread page 12\n> can a 33 inch farmhouse sink fit in 36 base?\nYes but measure the sink, not the website. Mine said 33 but the apron lip was wider, and the sink base face frame had to be cut. The installer dry-fit the sink three times, then discovered the disposal outlet hit the shelf. Someone in comments posted a sink template PDF, but it was for the single bowl version. Ad block in the middle: cabinet knobs, quartz sale, cabinet knobs. Final photo shows sink centered under window and a note saying no leaks after one week."
    - "Health inspection corrective action plan\nFinding 1: hand sink at coffee station lacked soap.\nFinding 2: employee rinsed blender jar in dump sink used for waste ice.\nFinding 3: mop sink was inaccessible behind flour rack.\nFinding 4: three compartment sink sanitizer at 0 ppm during lunch rush.\nCorrective action: install soap at hand sink, label dump sink, relocate flour rack, retrain staff on sink use by Friday, and post sink assignment chart above dish area. Owner comment: sanitizer logs attached, but inspector says logs do not match test strip reading. The scanned PDF repeats permit 24-109 / downtown district / permit 24-109 between findings, and the mobile copy drops the signature line. Recheck note added in margin: do not use hand sink as pitcher dump during espresso service."
    - "Room finish schedule\nA101 kitchenette: undermount sink, single lever faucet, disposal\nA102 restroom: wall sink, sensor faucet, insulated trap\nA103 janitor: mop sink, wall guard, hose bracket\nA104 lab: epoxy sink, acid waste neutralizer\nA105 staff lounge: bar sink, no disposal\nRevision cloud says sink in A102 moved 6 inches for door clearance. Sheet note from architect: verify sink backsplash height where mirror overlaps tile. Contractor RFI below asks whether janitor sink needs hose bib vacuum breaker or if faucet assembly includes it. The exported schedule lost column headers after A103, so the comments look like fixture names. Footer: preliminary not for construction, preliminary not for construction. Addendum says A105 sink deleted if coffee vendor supplies cart."
    - "Guest 11:47 pm: downstairs bath sink drains so slowly toothpaste just floats there, gross. Kitchen sink fine. Outdoor sink by grill has no cold handle but ignore that, we are leaving early. Host auto-reply says try reset router, completely unrelated."
    - "Auction listing copied with gallery captions\nLot 44 reclaimed porcelain sink with chrome legs\nLot 45 wall mount sink brackets, rusty\nLot 46 sink faucet parts, mixed box\nQuestions: does sink have cracks? Seller says hairline near overflow, see photo 7."
    - "Brewhouse punch list: grain room hand sink installed, tasting bar sink missing drain basket, keg wash sink needs spray hose. Inspector will not approve opening if hand sink is used for glass rinse. Owner reply says drain basket is in delivery box, but photo shows wrong diameter. Add laminated sign above hand sink before recheck."
    - "Portable clinic crate list\nfolding exam table\nvaccine cooler\nwash sink pump kit\n5 gal clean water jug\n5 gal gray water jug\nsink basin liner x20\nchlorine strips\ncustoms form says medical sink, plastic\nArrival checklist says test pump before setup and tape spare sink liner pack inside crate lid. Old manifest calls it wash station, not sink, which confused customs."
    - "> anyone else have this?\n> vessel sink splashing mirror, losing my mind\nKids bath is almost done except sink faucet is too tall. Plumber says shallow sink bowl plus high pressure. Replies ask aerator size, rim height, faucet reach, then two ads for towel warmers. OP update: smaller aerator helped but toothpaste still lands behind sink."
    - "County fair booth requirements: any food booth with sampling must have hand sink, waste bucket, and covered prep sink. A shared sink behind the barn is not acceptable during service. The PDF footer repeats livestock dates between fixture rules, and one applicant highlighted portable sink rental as proof. Inspector note says sink must have warm water, soap, and a catch tank."
    - "Maintenance export got flattened into one column: unit 4 sink leak open unit 6 sink stopper closed unit 7 kitchen sink slow drain open common hall janitor sink grate missing open. The mobile app dropped commas, but sink tickets are still assigned to plumbing."
    - "> gray tank smell after hills\n> galley sink burps when gray tank is nearly full\nBathroom sink drains into same tank, so bubbles show there first. Vent line above sink cabinet may be blocked by insulation. OP says smell comes from sink only on long downhill drives. Reply suggests checking air admittance valve under the sink and flushing tank before replacing trap."
    - "Commercial kitchen submittal\nitem 2.1 hand sink, splash guards both sides\nitem 2.2 prep sink, left drainboard\nitem 2.3 pot sink, three compartment\nitem 2.4 mop sink receptor\nitem 2.5 dump sink at beverage station\nRejected note: pot sink depth differs from approved sheet. Resubmittal must show faucet reach for each sink and confirm that hand sink is not blocked by the ice machine door. Supplier attached catalog pages in the wrong order, so the mop sink receptor appears under bar equipment. Reviewer comment in blue pencil: label sink compartments wash rinse sanitize on enlarged plan."
