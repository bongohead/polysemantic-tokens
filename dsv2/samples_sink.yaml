    - "> garage slab by door keeps sinking\nMy 1970s ranch did this. The corner did not sink all at once; first the caulk line opened, then the garage door track twisted, then the slab sank another hair after every storm. Mudjacking helped for a year. The real problem was roof water dumping beside the footing. Related posts inserted here: basement paint, patio chairs, coupon for gutters. After we ran the downspout to daylight, new foam lift held. If your screwdriver can sink six inches beside the slab, fix drainage before paying anyone to raise concrete. OP update two months later says the new patch did not sink after the first thunderstorm, but the walkway stones sink now because the old downspout extension stops short. Thread locked after contractor arguments."
