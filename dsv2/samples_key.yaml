        - "cover alt=\"black road at dusk\"\nThe verses circle Dm-Bb-F-C until the chorus feels trapped rather than sad. D minor is the home key, so the return after the Gm bridge feels inevitable instead of merely gloomy.\nComment below says the song sounds darker live because the singer slows the last cadence."
        - "441\tMorning Bells\tmajor\tA\t118\tbright\n442\tEvening River\tminor\tD minor\t\tquiet\n443\tPorch Light\tmajor\tF\t92\twarm\n444\tcopyright CCLI footer\t\t\t\t\nheader note lost in export: fourth column is display key, not composer initial."
        - "u/firstpiano: why does this easy song sound sad if the notes are mostly plain letter notes with no sharps?\nreply: the written notes do not decide mood by themselves. If the melody keeps coming home to A, you are probably hearing A minor as the key, not C major. Try singing the last note without looking at the page."
        - "River Morning | anthem | organ score G major | flute descant G major | folder count 28 | alto copies 26/28\npencil Bb insert in box belongs to 2024 carol service\nprinted tonal key remains G major for both organ and descant"
