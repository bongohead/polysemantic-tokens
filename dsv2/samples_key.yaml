        - "OP: old rental has one Schlage deadbolt and one mystery knob, can I make one key work for both?\nreply: that Schlage C cylinder profile will not accept a Kwikset key blank. Bring the lock cylinder to a shop if the bitting code is gone. A locksmith can rekey compatible cylinders, but the wrong blade profile means the key will not even enter.\n<div class=\"ad\">door closers 15% off</div>\n> landlord says just spray wd40\nplease do not. lubricant will not change the cylinder profile, and the brass key blank still has to match the lock profile.\nOP update: shop cut two new key copies for the rear deadbolt and replaced the front knob so one key now opens both doors. The old mystery knob key went in an envelope marked does not fit front after 5/3.\nmod note: photo of bitting removed; do not post usable key codes.\nfooter: sponsored locksets / image_missing / label the new key before move-out / related thread: mailbox lock stuck / cookie settings"
