        - "hotel was fine, elevator smelled like pool towels. Front desk gave us one plastic room key and one actual metal key for the beach gate, which felt weirdly old-school.\nbreakfast: cold eggs | parking: tight | beach key worked if you pulled the latch toward you | room card died twice | would stay again maybe"
        - "Mara clipped the bike-lock ribbon to the picnic basket before they left. At the pond she gave the tiny key to her brother, who liked the clicking sound of the U-lock.\n<div class=\"ad\">BUY 2 PICTURE BOOKS</div> Parent review: mostly about sharing, stamped bike key visible on every page spread."
        - "<div class=\"product\"><h1>Floating Boat Key Ring</h1><ul><li>holds two marine keys</li><li>orange foam float</li><li>stainless split ring</li></ul><p>Attach ignition key or locker key before boarding. Not a life-saving device.</p><div class=\"related\">dock lines / bilge sponge / ad</div></div>"
        - "Grandma kept the safe-deposit envelope in a tea tin with stamps and birthday candles, then forgot which bank it belonged to. The teller checked the tiny number on the key against box 2231 and asked for the second guard key from the vault officer.\nThe customer key went back into the envelope with her license copy; the guard key stayed behind the counter."
        - "ROOF HATCH: lift latch bar before pushing cover; exterior cylinder is marked RH-2. Insert hatch key, turn counter-clockwise.\nCAUTION do not leave key in exterior cylinder during snow removal.\nparts list: gasket 44B / lock cylinder RH / spare hatch key pouch"
        - "<li class=\"lot\"><span>Victorian walnut desk</span><span>marble top chipped</span><span>drawer key included</span><img alt=\"lock plate and brass key on green felt\"></li>\nQ&A collapsed under shipping calculator: pickup only; key will be taped inside top drawer; right drawer sticks unless lifted."
        - "Sam: where are my car keys\nLeah: blue bowl by the microwave\nSam: no, that has mailbox junk and a tiny luggage key\nLeah: check coat from yesterday\nSam: found the Honda key in the stroller cup holder, why do we own children\nLeah: bring the spare key too, the fob battery keeps dying"
        - "Return both the remote key fob and metal valet key with vehicle. Keep toll tag in windshield holder.\ntrunk release / fuel door / emergency blade / toll tag\nvehicle key handoff initials sit beside the damage diagram and fuel receipt. The sleeve also has three old airport shuttle ads, and the counter clerk circled the valet key line after the last renter returned only the plastic fob."
        - "propane cage access\nauthorized staff only\nlock type: weather padlock, long shackle\nrequired item: cage key on orange tag\nDO NOT use forklift key, office key, or bolt cutters unless supervisor signs emergency release.\nAD AD propane refill coupon 20 lb"
        - "Portable steel lockbox, black, with two barrel keys and removable coin tray. Tiny key number is stamped on bow; cylinder face shown in photo 3.\nProduct bullets: locking lid, carry handle, interior divider, and two spare key labels in envelope. Buyer review says the barrel key turns smoothly if the lid is pushed down first."
        - "The rental car counter handed me a fob the size of a biscuit and a separate metal trunk key because the hatch release was broken. Receipt printer jammed after fuel policy, so the return clerk wrote trunk key returned in pen.\nOn the second day the fob opened the doors, but only the little metal key would turn the glove-box lock."
