        - "Contest packet page 3 has the score in G while trumpet folders show A on the first line. The judge hears the ensemble's sounding key, not the transposed part label.\nClarinet margin math: Bb instrument reads one whole step higher. Someone wrote remember: score G, clarinets A, altos E."
