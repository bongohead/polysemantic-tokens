- token: " key"
  meanings:
    - meaning_label: "device_to_open_locks"
      text_samples:
        - "Mina found the little diary lock open and immediately blamed her brother, which was unfair because the tiny heart-shaped key was still taped under her desk where she left it. The sticker page had three crossed-out passwords and one entry about school pictures.\nLater she moved the diary key into a pencil pouch and wrote NOT A TOY on the lock in silver marker."
        - "To open the garden shed padlock, slide the rubber cover down, insert the brass key all the way, and lift the shackle while turning. The spare key hangs on a nail inside the kitchen pantry, not outside by the hose.\nmanual margin: old steel key from chicken coop looks similar; will jam in this lock."
        - "service,blank,price,notes\nhouse door copy,KW1,3.49,test in customer lock when possible\nsmall cabinet key,ILCO 1176,4.25,no automotive chips\nskeleton key blank,BIT-2,8.99,fits some antique warded locks\nAD_SLOT_TOP,weekly circular,,paint sale"
        - "The front deadbolt snapped at 6:12, leaving Mara outside with soup cooling on the porch. Her neighbor tried tweezers, then a magnet, then finally called the shop.\nservice call 85 / broken blade removed / duplicate key 3.50\nThe new key turned the front lock twice before the tech left. The old laundry-room key still worked, but the rear gate needed a separate copy tagged BACK."
        - "asset,event,item,holder,initials\nvan07,out,ignition key,route driver,MS\nvan07,in,ignition key,supervisor,LT\nvan07,stored,spare key fob,cabinet V7-B,LT\nfuel_card,last4,driver\n7712,route driver\nrow 99,notes,two ignition rows plus fuel card row keep importing into accounting"
