    - meaning_label: "critical_important"
      text_samples:
        - "...works offline during storms, syncs when service returns, and keeps receipts attached to each stop.\nFor the plan page, saved route proof, shared pickup notes, and delayed-sync alerts are features that are key. The alert timing is key too, because crews lose signal before the last stop.\n<div class=\"cookie\">accept all</div><footer>winter launch discount - expired</footer>"
        - "for small shops that hate spreadsheet chores\nsignup copy: benefits remain key for small teams\n- renewal reminders before the busy season\n- shared notes on service calls\n- fewer missed invoices when the owner is on the road\nThe comparison table repeats the monthly price under every column because the sticky header broke."
        - "In The River House, the theme of inheritance is key, not just money but stories people refuse to tell. The old boat matters because each sister remembers a different version of the same summer.\nLMS side comment: good theme sentence; now quote chapter 4 before the movie comparison. The rubric text repeats below the comment box."
        - "02:13 image build done\n02:18 workers restart\n02:21 errors spike\n02:28 migration finishes\npayment errors looked regional because only new pods hit the changed column.\nretro action items\n- migration health before worker restart should stay key in the checklist\n- owner listed on rollback card, also key before rollback starts\n- status page draft ready by deploy start\ncustomer impact / customer impact / owner column blank"
        - "By noon the courthouse steps were full of microphones, but the afternoon story moved away from the blurry bodycam clip. The neighbor who saw the handoff became a witness prosecutors called key after they said the inventory report only showed what happened later.\nDateline paragraph got pasted twice in the CMS preview, and the photo caption still names the wrong entrance."
        - "wash hands\nstay home when feverish\ncall clinic for worsening symptoms\n- fresh-air ventilation in crowded cafeterias and buses is the winter-outbreak message that is key\nSpanish line about filters is missing. Approval chain: comms approved, district pending, clinic director wants the phone number higher."
        - "bus stops, school walks, senior apartment entrances are sites that are key\napplication due 06/14 and council vote 07/02 are dates that are key\nparks, transit, neighborhood clinics are partners that are key\nphoto_credit={{placeholder}} / mobile footer repeats council calendar"
        - "occupancy punch list\nroof tie-ins open\nADA ramp slope concern\nwindow trim cosmetic\ndrainage photo missing\n- photo showing water moving away from threshold is evidence reviewers marked key before approval\n- drain path remains key after roof tie-ins close\nContractor copied last week's status below the new rows, so two items look reopened."
