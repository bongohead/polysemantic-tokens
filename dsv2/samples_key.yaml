        - "Rain turned the trailer steps slick, and the crane padlock key slid out of the superintendent's clipboard into wet gravel. The concrete truck was already backing in, beeping over the noise hotline number taped to the fence.\nLuis found the yellow tag by stepping on it. After that, nobody taped a key to the sign-in clipboard."
        - "The boat would not start because the ignition key was in Ben's hoodie, which was in the dryer, which was thumping louder than the bilge pump. The cabin key hung on brass tag C exactly where it belonged; naturally, that was the one nobody needed.\nThey used the spare ignition key from the dockmaster and left the black float on it this time."
